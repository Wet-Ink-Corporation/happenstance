[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A versionless path dependency is a wildcard, and one of them is deliberate:
# `happenstance` dev-depends on `happenstance-testkit` by path with no version,
# because a dev-dependency carrying a version has to resolve from the registry at
# publish time — which would make the testkit publish *before* `happenstance` and
# undo the independent release order CF-32's own version number exists to give it.
# Cargo strips a versionless dev-dependency from the published manifest entirely,
# so nothing a consumer resolves is affected.
#
# Scoped rather than switched off: this permits a wildcard only where it is a
# *path* dependency, so a wildcard against the registry — the case `wildcards =
# "deny"` is actually for — still fails.
allow-wildcard-paths = true
# `#[async_trait]` injects `+ Send` into every method it desugars, which makes
# the wasm32 / Cloudflare Workers target impossible — a Durable Object's store is
# `!Send` by construction. ADR-0001 chose `trait_variant` over it and derives the
# `Send` flavour instead, and nothing in this workspace failed if someone added
# the crate back to a manifest to make a trait object-safe. This is that check.
#
# Be honest about its strength: `cargo deny` is an OPTIONAL, probed gate step, so
# on a machine without the tool this ban is unenforced. It is the *legible*
# guard. The unskippable one is `crates/happenstance/tests/flavours.rs`, which
# instantiates every typed-layer entry point against a store that is genuinely
# `!Send` and stops compiling the moment a `Send` bound reaches the chain.
#
# `wrappers` and not a blanket allow. The ban's first run found `async-trait`
# already in the lock file, reached only from `wasm-bindgen-test`, which is a
# dev-dependency of the conformance harnesses and appears in no published
# artifact. Exempting it **by name** is what keeps the ban real: a second route
# into the graph — a manifest that names the crate itself, or any other crate
# that pulls it in — is a new wrapper this list does not carry, and the check
# fails until someone decides it should.
#
# That second route arrived at phase 9, and this is the decision the sentence
# above asked for. `worker` 0.8.5 — the Cloudflare Workers SDK that
# `happenstance-cloudflare` now binds — depends on `async-trait 0.1.91`
# unconditionally, and `worker-macros` reaches it as well. The check failed, as
# designed, and the finding is recorded in
# `.bklg/from-contract-to-published-library/cloudflare-durable-object-store/worker-binding-layer/_ledger.md`
# (AC-008) and is owed ratification in ADR-0023.
#
# What the two new wrappers permit, stated precisely so the exemption cannot be
# read wider than it is:
#
#   * `worker` uses `#[async_trait]` for **its own** `DurableObject` trait. The
#     attribute injects `+ Send` into the methods *it* desugars — that is a
#     property of `worker`'s trait, not of happenstance's ports.
#   * No happenstance port gains a bound from it. ADR-0001's derivation is
#     untouched: `happenstance-core` still declares each port once without a
#     `Send` bound and lets `trait_variant` derive the second flavour.
#   * The substantive guard is not this line and never was — the file already
#     says so. `crates/happenstance/tests/flavours.rs` instantiates every typed
#     entry point against a genuinely `!Send` store, and phase 9 added a second:
#     `happenstance-cloudflare`'s `!Send` probes now run on `wasm32` as well as
#     on the host, so a `+ Send` reaching this adapter's error, store or stream
#     fails a test on the target the bound would foreclose.
#
# A third route is still a failure. Anything other than these three names
# reaching `async-trait` fails this check until someone decides it should not,
# which is the sentence above, unchanged.
deny = [
    { crate = "async-trait", wrappers = [
        "wasm-bindgen-test",
        "worker",
        "worker-macros",
    ], reason = "ADR-0001: injects `+ Send`, which forecloses wasm32" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
