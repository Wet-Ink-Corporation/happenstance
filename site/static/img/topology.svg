<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">One history across device, edge and cloud</title>
  <desc id="d">A device keeps a SQLite log, an edge hub keeps a Durable Object log, and a central Postgres or Neon database keeps the system of record. Sync links them; every change is kept and conflicts arrive as events. Each tier holds the views it needs.</desc>
  <rect width="960" height="360" rx="16" fill="#fffbf2"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2a211b"/>
    </marker>
  </defs>
  <g fill="#2a211b">
    <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700">One history, everywhere it lives</text>
  </g>
  <!-- tiers -->
  <g>
    <rect x="40" y="70" width="240" height="150" rx="12" fill="#2a211b"/>
    <text x="160" y="104" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#fbb424">DEVICE</text>
    <text x="160" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#fffbf2">SQLite</text>
    <text x="160" y="164" text-anchor="middle" font-size="14" fill="#e9dfd0">works offline</text>
    <text x="160" y="186" text-anchor="middle" font-size="14" fill="#e9dfd0">decides locally</text>

    <rect x="360" y="70" width="240" height="150" rx="12" fill="#2a211b"/>
    <text x="480" y="104" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#fbb424">EDGE</text>
    <text x="480" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#fffbf2">Durable Object</text>
    <text x="480" y="164" text-anchor="middle" font-size="14" fill="#e9dfd0">a hub per tenant</text>
    <text x="480" y="186" text-anchor="middle" font-size="14" fill="#e9dfd0">close to your users</text>

    <rect x="680" y="70" width="240" height="150" rx="12" fill="#2a211b"/>
    <text x="800" y="104" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#fbb424">CENTRAL</text>
    <text x="800" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#fffbf2">Postgres · Neon</text>
    <text x="800" y="164" text-anchor="middle" font-size="14" fill="#e9dfd0">system of record</text>
    <text x="800" y="186" text-anchor="middle" font-size="14" fill="#e9dfd0">settles conflicts</text>
  </g>
  <!-- sync arrows -->
  <g stroke="#2a211b" stroke-width="2.5" fill="none">
    <line x1="290" y1="145" x2="350" y2="145" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="610" y1="145" x2="670" y2="145" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="#7a5a12" font-size="12" font-weight="700" text-anchor="middle">
    <text x="320" y="132">sync</text>
    <text x="640" y="132">sync</text>
  </g>
  <!-- views -->
  <g font-size="13" text-anchor="middle">
    <rect x="70" y="240" width="180" height="40" rx="8" fill="#fde9b8"/>
    <text x="160" y="265" fill="#2a211b">view: my cases</text>
    <rect x="390" y="240" width="180" height="40" rx="8" fill="#fde9b8"/>
    <text x="480" y="265" fill="#2a211b">view: this tenant</text>
    <rect x="710" y="240" width="180" height="40" rx="8" fill="#fde9b8"/>
    <text x="800" y="265" fill="#2a211b">view: 1M customers</text>
  </g>
  <g fill="#2a211b" font-size="14" text-anchor="middle">
    <text x="480" y="318">Every change is kept · conflicts arrive as events · every view can be rebuilt</text>
    <text x="480" y="340" fill="#6b5d50" font-size="12">Pick the pieces you need. Each decision runs where the history it reads is complete.</text>
  </g>
</svg>
