[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
# The number `happenstance`, `happenstance-core`, `happenstance-sqlite` and
# `happenstance-cloudflare` all inherit. `happenstance-testkit` does not — see
# its own manifest, and CF-32 for why.
#
# `0.2.0` and not `0.1.0` because phase 4 was a breaking change to a version that
# had not moved, and `cargo-semver-checks` said so on the pull request: seven
# major lints against `happenstance-core`, every one of them a decision an ADR
# had already taken. Nothing was published, so nothing downstream broke; the
# number still had to move, because a true finding is not silenced.
#
# **Stable, as of this release, and that costs something on purpose.** The
# `-alpha.1` that stood here existed so that "we can't change that now" was not
# available as an argument while the API was still being decided. It is
# available now, and it should be: the frozen `EventStore` clauses are
# semver-binding from here. `ProjectionStore` was *not* covered at `0.2.0` —
# it shipped behind an off-by-default `unstable-projection` feature with a
# written exemption — and is from the next release, ADR-0063 having lifted the
# gate once adapters at both ends of the batch-shape axis had passed its suite.
version = "0.3.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wet-Ink-Corporation/happenstance"
# Both were null until the release, which made `repository` the *only* outbound
# link on five crates.io pages — and it 404'd anonymously for as long as the
# repository was private, so a reader wanting the specification, the decision
# records or a security contact had one door and it was locked. Cheap to state
# and load-bearing when it is the only one.
#
# `documentation` is NOT here, and its absence is the decision. docs.rs is
# per crate, so one inherited URL would point four of the five at the wrong page
# — worse than leaving it unset, because crates.io falls back to the right
# `docs.rs/<name>` on its own. Each publishable crate names its own below.
homepage = "https://github.com/Wet-Ink-Corporation/happenstance"
authors = ["Ryan Britton"]
keywords = ["event-sourcing", "dcb", "cqrs", "event-store"]
categories = ["database", "data-structures"]

# Single source of truth for every third-party version. Members write
# `bytes.workspace = true` so the graph can never end up with two versions of
# the same crate — the classic multi-crate Rust foot-gun.
[workspace.dependencies]
# --- internal ---
# `default-features = false` here so that each member states the features it
# actually needs. Cargo forbids a member from *removing* a workspace default,
# so the permissive choice at this level would silently pull `memory` (and its
# `std` requirement) into every adapter.
#
# The three requirement strings move with the version above, and this is the
# highest-cost line in the file to get wrong: a requirement naming a version
# that was never released resolves fine from the path while the workspace is
# intact and fails only on the *second* `cargo publish` — after
# `happenstance-core` is live and unremovable. They moved off `0.2.0-alpha.1`
# in the same commit as the version, which is the only order that is ever green.
happenstance-core = { version = "0.3.1", path = "crates/happenstance-core", default-features = false }
happenstance = { version = "0.3.1", path = "crates/happenstance", default-features = false }
happenstance-testkit = { version = "0.3.1", path = "crates/happenstance-testkit" }

# --- external ---
# WF-11's payload encoding, and pinned to `0.22` rather than to the newer `0.23`
# on a measurement rather than on taste: `sqlx` already pulls `base64 0.22.1`
# into this graph, and `base64` has no transitive dependencies of its own. At
# `"0.22"` the addition is a new *edge* to an existing *node* — zero new crates
# for the workspace, exactly one leaf crate for a consumer taking
# `happenstance-core/serde` without sqlx. Asking for `"0.23"` would put two
# majors in the graph, which `deny.toml`'s `multiple-versions = "warn"` reports
# rather than fails — a warning nobody reads, which is worse than a failure.
# `default-features = false` because the contract crate is `no_std`; it names
# `base64/alloc` in its own `serde` feature (ADR-0016 §10).
base64 = { version = "0.22", default-features = false }
bytes = { version = "1.10", default-features = false }
# `happenstance`'s CBOR codec, behind its `cbor` feature. Added on a licence
# verdict taken before the dependency landed rather than after: `cargo deny
# check licenses` passes (`ciborium`, `ciborium-io` and `ciborium-ll` are
# Apache-2.0; `half`, `cfg-if` and `zerocopy` are `MIT OR Apache-2.0`), and the
# seven new nodes introduce no duplicate major — the `syn 2` its derive reaches
# is already in this graph through `sqlx` → `url` → `idna` → `icu` → `yoke`.
# `std` is named rather than inherited, for the reason `base64/alloc` is: it is
# a default today, and a crate that drops a default in a patch release breaks a
# dependant that changed nothing.
ciborium = { version = "0.2", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
# `bundled` compiles the SQLite C amalgamation with the host toolchain, so no
# system SQLite is needed on any developer machine or CI runner.
# `default-features = false` drops `ffi-sqlite-wasm-rs`, which 0.40 turned on by
# default and which no native adapter wants.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# No longer dev-only, and the move is the point: `happenstance` ships a postcard
# codec behind its `postcard` feature, so a published crate links this. It was
# already here as the non-self-describing half of WF-7's two-format matrix, and
# the reason that matrix is two formats: a `skip_serializing_if` attribute
# round-trips cleanly in `serde_json` and desynchronises the stream here.
#
# `default-features = false` is load-bearing and was measured, not guessed. The
# default turns on `heapless-cas`, which reaches `heapless 0.7` and then
# `atomic-polyfill 1.0.3` — unmaintained, RUSTSEC-2023-0089, "no safe upgrade is
# available", and `cargo deny check advisories` fails the gate on it. Nothing
# here wants a fixed-capacity `Vec`; `use-std` is the flavour that serialises
# into `std`'s, and it is what both the wire tests and the codec use.
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# The `/sql` endpoint speaks JSON, so `happenstance-neon` decodes JSON. `std`
# rather than `alloc` because the endpoint's `bigint`-as-string rendering needs
# arbitrary-precision parsing off the `std` float path.
serde_json = { version = "1", default-features = false, features = ["std"] }
# No TLS backend selected here, and members must not add one casually: `sqlx`'s
# `tls-rustls` fails `cargo deny check licenses` against this workspace's
# allowlist. Measured, not assumed — the offender is not the one everybody
# expects:
#
#   error[rejected]: failed to satisfy license requirements
#     webpki-roots-0.26.11/Cargo.toml:25  license = "CDLA-Permissive-2.0"
#     webpki-roots-1.0.9/Cargo.toml:26    license = "CDLA-Permissive-2.0"
#
# `ring` 0.17.14 is `Apache-2.0 AND ISC` and passes; it is the Mozilla CA root
# *bundle* — data, not code — that carries CDLA-Permissive-2.0. `tls-native-tls`
# passed on Windows, where it resolves to `schannel` (MIT); that says nothing
# about the Linux graph, which reaches `openssl-sys` instead and has not been
# checked here. A skeleton whose bodies are `todo!()` connects to nothing, so the
# feature buys nothing today and the question is owed a real answer at the point
# something actually dials out.
sqlx = { version = "0.8", default-features = false }
thiserror = { version = "2", default-features = false }
# The Cloudflare Workers SDK, and the reason `happenstance-cloudflare` stopped
# being a stand-in. Taken at **minimum width**: `worker` declares no `default`
# feature set at all, so `default-features = false` here is a statement rather
# than a change, and none of `axum`, `d1`, `http`, `queue`, `timezone` or
# `tokio-postgres` is named — every one of them is licence surface, advisory
# surface and compile time for a crate that needs exactly two things from this
# SDK: `worker::Error` and the Durable Object `SqlStorage` binding.
#
# Priced at merge rather than on a Tuesday cron (ADR-0029's discipline): it
# declares `rust-version = "1.75"`, comfortably under this workspace's 1.97.1
# floor, and `cargo deny check licenses advisories bans` is green against
# `deny.toml`'s unmodified allowlist — `worker` itself is Apache-2.0. The
# measurements are written up in the `worker-binding-layer` story ledger.
worker = { version = "0.8.5", default-features = false }
# No longer dev-only, and the move is the point: `happenstance-sqlite` names
# `JoinError` and `JoinHandle` in its error enum and its read stream, and
# `happenstance-postgres` reaches tokio through `sqlx`'s `runtime-tokio`. Left
# under the header below, the manifest would say "dev / tooling only" about a
# crate two adapters link against — and `ci.yml`'s msrv job reasons out loud
# about `--no-dev-deps` hiding tokio, which stopped being true here.
tokio = { version = "1", default-features = false }
trait-variant = "0.1.3"

# --- dev / tooling only ---
anyhow = "1"
proptest = "1"
# The compile-fail harness. It is the only instrument that can pin a *diagnostic*
# rather than the fact that something failed to compile: rustdoc collects
# doctests from the lib target only, and on 1.97.1 it silently ignores an
# unmatched error-code annotation, so `compile_fail,E0004` asserts no more than
# bare `compile_fail` — and a negative control that cannot discriminate is not a
# negative control (`spec/SPECIFICATION.md:8772`;
# `crates/happenstance-core/src/event.rs:95-106`).
#
# Adopted on a measurement, not on taste — the `postcard` note above is the
# precedent. It adds ten nodes to `Cargo.lock`: `trybuild` itself, `glob`,
# `target-triple`, `termcolor`, `serde_spanned`, `winnow` and the four `toml*`
# crates. `cargo deny check licenses` and `cargo deny check advisories` both pass
# against the **unmodified** allowlist at `deny.toml:8-19`, and
# `multiple-versions` reports nothing new. It is consumed only as a
# `[dev-dependencies]` of `course-subscriptions`, which is `publish = false`, so
# no published crate's graph, feature set or MSRV floor moves; `cargo hack
# --no-dev-deps --rust-version` cannot see it at all.
trybuild = "1.0"
# The live-Postgres fixture's server. Dev-only in both directions: it is a
# `[dev-dependencies]` of `happenstance-postgres` alone, so no published graph,
# feature set or MSRV floor moves, and `cargo hack --no-dev-deps --rust-version`
# cannot see it at all. It declares `rust-version = "1.88"`, comfortably under
# this workspace's 1.97.1 floor — but the msrv job's second half runs a full
# `cargo test --workspace --all-features`, which does not hide dev-deps, so that
# is where the claim is actually checked.
#
# `default-features = false` on a measurement rather than on taste. The graph
# reaches `rustls` and `ring` either way; `ring` is `Apache-2.0 AND ISC` and
# passes, and it stops short of `webpki-roots`, which is the `CDLA-Permissive-2.0`
# offender the `sqlx` note above names. The flag buys a statement of what is
# asked for, not a smaller graph.

#
# Deliberately **not** `testcontainers-modules`. Its Postgres module carries its
# own image tag, which this fixture would have to override anyway, and the tag is
# the one thing that must be pinned where a reader can see it: an unpinned image
# makes a red job unattributable to a change in this repository. The fixture says
# `GenericImage::new("postgres", "17.10")` — the exact server
# `experiments/position-visibility/` took its numbers on.
# `reusable-containers` is named back on purpose, and it is a bug fix rather
# than a convenience. The fixture holds its `ContainerAsync` in a `static`, which
# Rust never drops at process exit, so nothing stopped the server and every run
# of the test binary left another Postgres behind -- twenty-seven of them before
# the machine ran out of memory mid-suite and made the leak visible. The crate's
# intended fix is its `watchdog` feature, which does not build on Windows
# (`SIGQUIT` is Unix-only) and this workspace treats Windows as first-class.
# Reuse bounds the leak at exactly one container instead of one per run.
testcontainers = { version = "0.28", default-features = false, features = [
    "reusable-containers",
] }
# Only ever a `cfg(target_arch = "wasm32")` dev-dependency. It is here so the
# testkit can *demonstrate* the third harness (CF-23); nothing in the published
# graph depends on it.
wasm-bindgen-test = "0.3"

# Shared lint policy. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# `priority = -1` lets the specific allows below override the group.
pedantic = { level = "warn", priority = -1 }
# Idiomatic here: `EventType`, defined in the private `event` module and
# re-exported as `happenstance_core::EventType`, reads better at every call site
# than the `event::Type` this lint would prefer.
module_name_repetitions = "allow"
# Public fallible/panicking APIs must document why.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# No silent unwraps in library code; test modules override locally with a scoped
# `#![allow(clippy::unwrap_used)]`. Denied rather than warned: CI passes `-D
# warnings` anyway, so `warn` differed from `deny` only in whether a local build
# let it slide — and a lint you can ignore locally is one you learn to ignore.
unwrap_used = "deny"
# Was `allow`, workspace-wide, for stub crates that were "intentionally
# unimplemented". Denied now, because a grep found no `todo!()` anywhere in the
# workspace — the allow protected nothing and would have silently accepted the
# first real one. A crate that needs it can opt in with a scoped
# `#![allow(clippy::todo)]`, which is visible in review; this was not.
todo = "deny"
# We apply `#[must_use]` deliberately rather than exhaustively; the lint fires on
# every pure accessor and drowns out real findings.
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
