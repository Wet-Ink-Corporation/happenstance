[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wet-Ink-Corporation/happenstance"
authors = ["Ryan Britton"]
keywords = ["event-sourcing", "dcb", "cqrs", "event-store"]
categories = ["database", "data-structures"]

# Single source of truth for every third-party version. Members write
# `bytes.workspace = true` so the graph can never end up with two versions of
# the same crate — the classic multi-crate Rust foot-gun.
[workspace.dependencies]
# --- internal ---
# `default-features = false` here so that each member states the features it
# actually needs. Cargo forbids a member from *removing* a workspace default,
# so the permissive choice at this level would silently pull `memory` (and its
# `std` requirement) into every adapter.
happenstance-core = { version = "0.2.0", path = "crates/happenstance-core", default-features = false }
happenstance = { version = "0.2.0", path = "crates/happenstance", default-features = false }
happenstance-testkit = { version = "0.2.0", path = "crates/happenstance-testkit" }

# --- external ---
bytes = { version = "1.10", default-features = false }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
# `bundled` compiles the SQLite C amalgamation with the host toolchain, so no
# system SQLite is needed on any developer machine or CI runner.
# `default-features = false` drops `ffi-sqlite-wasm-rs`, which 0.40 turned on by
# default and which no native adapter wants.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# The `/sql` endpoint speaks JSON, so `happenstance-neon` decodes JSON. `std`
# rather than `alloc` because the endpoint's `bigint`-as-string rendering needs
# arbitrary-precision parsing off the `std` float path.
serde_json = { version = "1", default-features = false, features = ["std"] }
# No TLS backend selected here, and members must not add one casually: `sqlx`'s
# `tls-rustls` fails `cargo deny check licenses` against this workspace's
# allowlist. Measured, not assumed — the offender is not the one everybody
# expects:
#
#   error[rejected]: failed to satisfy license requirements
#     webpki-roots-0.26.11/Cargo.toml:25  license = "CDLA-Permissive-2.0"
#     webpki-roots-1.0.9/Cargo.toml:26    license = "CDLA-Permissive-2.0"
#
# `ring` 0.17.14 is `Apache-2.0 AND ISC` and passes; it is the Mozilla CA root
# *bundle* — data, not code — that carries CDLA-Permissive-2.0. `tls-native-tls`
# passed on Windows, where it resolves to `schannel` (MIT); that says nothing
# about the Linux graph, which reaches `openssl-sys` instead and has not been
# checked here. A skeleton whose bodies are `todo!()` connects to nothing, so the
# feature buys nothing today and the question is owed a real answer at the point
# something actually dials out.
sqlx = { version = "0.8", default-features = false }
thiserror = { version = "2", default-features = false }
# No longer dev-only, and the move is the point: `happenstance-sqlite` names
# `JoinError` and `JoinHandle` in its error enum and its read stream, and
# `happenstance-postgres` reaches tokio through `sqlx`'s `runtime-tokio`. Left
# under the header below, the manifest would say "dev / tooling only" about a
# crate two adapters link against — and `ci.yml`'s msrv job reasons out loud
# about `--no-dev-deps` hiding tokio, which stopped being true here.
tokio = { version = "1", default-features = false }
trait-variant = "0.1.3"

# --- dev / tooling only ---
anyhow = "1"
proptest = "1"
# Only ever a `cfg(target_arch = "wasm32")` dev-dependency. It is here so the
# testkit can *demonstrate* the third harness (CF-23); nothing in the published
# graph depends on it.
wasm-bindgen-test = "0.3"

# Shared lint policy. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# `priority = -1` lets the specific allows below override the group.
pedantic = { level = "warn", priority = -1 }
# Idiomatic here: `EventType`, defined in the private `event` module and
# re-exported as `happenstance_core::EventType`, reads better at every call site
# than the `event::Type` this lint would prefer.
module_name_repetitions = "allow"
# Public fallible/panicking APIs must document why.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# No silent unwraps in library code; test modules override locally with a scoped
# `#![allow(clippy::unwrap_used)]`. Denied rather than warned: CI passes `-D
# warnings` anyway, so `warn` differed from `deny` only in whether a local build
# let it slide — and a lint you can ignore locally is one you learn to ignore.
unwrap_used = "deny"
# Was `allow`, workspace-wide, for stub crates that were "intentionally
# unimplemented". Denied now, because a grep found no `todo!()` anywhere in the
# workspace — the allow protected nothing and would have silently accepted the
# first real one. A crate that needs it can opt in with a scoped
# `#![allow(clippy::todo)]`, which is visible in review; this was not.
todo = "deny"
# We apply `#[must_use]` deliberately rather than exhaustively; the lint fires on
# every pure accessor and drowns out real findings.
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
