[package]
name = "happenstance-sqlite"
description = "SQLite event store and projection store adapters for happenstance. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
happenstance-core = { workspace = true, features = ["std"] }
futures-core.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
# A real dependency, not a dev one: the read stream defers its `spawn_blocking`
# into `poll_next`, so `tokio::task::{JoinError, JoinHandle}` appear in the
# adapter's own error enum and stream state. `rt` is the whole of what is needed.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# `proptest` is the testkit's own off-by-default feature, and it is enabled
# **here** rather than mirrored as a feature of this crate because
# `cfg(feature = "…")` names the *current* crate's features: `happenstance-sqlite`
# cannot `cfg` on a dependency's feature at all, which is why
# `crates/happenstance-testkit/tests/memory_model_conformance.rs`'s inner
# `#![cfg(all(not(target_arch = "wasm32"), feature = "proptest"))]` works only
# from inside the testkit. The rejected alternative was a `proptest` feature on
# this crate forwarding to it: the project's conformance command is
# `cargo test -p happenstance-sqlite` with no flags, and a family that needs an
# extra flag to appear is a family that silently does not run. It is a
# dev-dependency, so nothing it pulls in reaches a consumer of this crate.
happenstance-testkit = { workspace = true, features = ["proptest"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = ["event-store", "projection-store"]
# Both roles share one driver and one connection story, so they share a crate
# and are separated by features rather than by another package.
event-store = []
# One capability, one switch. `happenstance-core`'s projection port is behind its
# own off-by-default `unstable-projection` gate, and this feature *enables* it
# rather than sitting beside it: a crate with two switches for one capability is
# a crate where the weaker one wins silently.
projection-store = ["happenstance-core/unstable-projection"]

[lints]
workspace = true
