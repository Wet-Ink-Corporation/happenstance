[package]
name = "happenstance-sync"
description = "Instance-to-instance event replication for happenstance. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# `serde` is non-optional here: replication is the reason `happenstance-core`'s
# serde feature exists.
happenstance-core = { workspace = true, features = ["std", "serde"] }
# Direct as of phase 5. It was not, because the envelope derives were withdrawn
# pending a versioned wire format; ADR-0016 §11 settles that, and `wire::Envelope`
# carries a `Serialize` derive and a hand-written `Deserialize`. The message types
# still carry none — see `lib.rs`.
serde.workspace = true
thiserror.workspace = true
trait-variant.workspace = true

[dev-dependencies]
# Only the cursor-shape probe needs a `Stream`; the port itself does not, which
# is the finding rather than an omission.
futures-core.workspace = true
# WF-8's two rules run in both formats, because the obligation the clause states
# is discharged differently in each: by position in postcard, by an explicit
# check in `serde_json`, where key order is not observable (ADR-0016 §11).
postcard.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = []
# The coherence proof for `IngestStore` lives behind this flag, because it is an
# impl *for a type in another crate* and that type only exists when
# `happenstance-core/memory` is on. Not a default: nothing in this crate's own
# API depends on it, and a feature that exists to compile one experiment should
# not be paid for by anyone who is not running the experiment.
memory = ["happenstance-core/memory"]

[lints]
workspace = true
