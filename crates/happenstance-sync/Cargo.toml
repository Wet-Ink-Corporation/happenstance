[package]
name = "happenstance-sync"
# The placeholder's words, held to them by `xtask/src/reserve.rs`'s
# `a_crate_with_a_readme_carries_what_the_placeholder_carries`: the reservation
# and the release describe the same crate. The runner it names is #244's, not
# written yet, and the README's status says so.
description = "Instance-to-instance event replication for happenstance: the peer port and its runner."
# The workspace's number, in lockstep with the adapters whose optional `sync`
# feature names this crate (#108 part E). An independent number would still
# have to move with every adapter on each break of this crate, and the release
# workflow's tag check already assumes one number for every crate it lists.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/happenstance-sync"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Published since #108 part E, and still unfinished: the port, the wire
# messages and the reference peer ship; the runner (#244) and a network peer do
# not exist yet. The crate root's `# Status` says which clauses are provisional.

[dependencies]
# `serde` is non-optional here: replication is the reason `happenstance-core`'s
# serde feature exists.
#
# `unstable-projection` was here for a reason no compiler error would have
# shown: this crate names no projection *type*, but `lib.rs`'s open-questions
# prose carries cross-crate intra-doc links into the port, and a link into a
# `cfg`-gated item is a hard rustdoc error under `broken_intra_doc_links = "deny"`
# the moment the gate is closed. The port is unconditional since ADR-0063, so
# the links resolve on every configuration and the feature is gone from here.
happenstance-core = { workspace = true, features = ["std", "serde"] }
# Direct as of phase 5. It was not, because the envelope derives were withdrawn
# pending a versioned wire format; ADR-0016 §11 settles that, and `wire::Envelope`
# carries a `Serialize` derive and a hand-written `Deserialize`. The message types
# carry derives since #114, when the message set was decided — see `lib.rs`.
serde.workspace = true
thiserror.workspace = true
trait-variant.workspace = true

[dev-dependencies]
# Not a second dependency: the same crate with the in-memory store switched on,
# for tests only. `tests/flavours.rs` wraps `MemoryEventStore` in an `Rc` to get
# a store that is genuinely `!Send` (SY-17), and the runtime build of this crate
# still never pulls the in-memory store unless its own `memory` feature asks.
happenstance-core = { workspace = true, features = ["std", "serde", "memory"] }
# Only the cursor-shape probe needs a `Stream`; the port itself does not, which
# is the finding rather than an omission.
futures-core.workspace = true
# WF-8's two rules run in both formats, because the obligation the clause states
# is discharged differently in each: by position in postcard, by an explicit
# check in `serde_json`, where key order is not observable (ADR-0016 §11).
postcard.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = []
# `MemorySyncPeer`: the conformance suite's reference peer, the doctest target,
# and something an application author can test their sync wiring against before
# a real peer exists (`src/memory.rs` says why it is all three). Not a default: a
# deployment never replicates to a peer in its own memory. It forwards
# `happenstance-core/memory` because the in-memory ingest oracle beside it,
# `MemoryIngestStore` (#108), is built over the same reference types, and
# because an author testing against this peer wants the reference store too.
# The feature gates both: the peer and the store this crate owns.
memory = ["happenstance-core/memory"]

# The test targets that construct a `MemorySyncPeer`. Named rather than gated
# with `#![cfg(feature = "memory")]` inside the file, so that without the
# feature the target is not built at all, and naming it with `--test` is an
# error rather than an empty binary that passes. The gate runs `--all-features`.
[[test]]
name = "flavours"
required-features = ["memory"]

[[test]]
name = "real_peer_shapes"
required-features = ["memory"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
