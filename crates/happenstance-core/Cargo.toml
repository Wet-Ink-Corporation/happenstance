[package]
name = "happenstance-core"
description = "DCB-compliant event sourcing contract: the EventStore and ProjectionStore ports, their value types, and in-memory reference stores for both."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/happenstance-core"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Stated rather than auto-discovered. Cargo would find README.md anyway, but the
# key is what crates.io renders on the package page, and a silent default is a
# poor thing to rely on for the first impression anyone gets of the crate.
readme = "README.md"

# Excluded because it `include_str!`s across the package boundary.
#
# `tests/trait_variant_pin.rs` reads the workspace `Cargo.lock` — a file that
# exists in the workspace and not in the `.crate`. It lived in `src/store.rs`
# until the `0.2.0` pass, where no `exclude` could reach it because the file is
# the library; moving it here is what makes the exclusion possible at all.
#
# Nothing caught the original: `cargo package --list` never compiles, and the
# verification build compiles the library, not its tests.
exclude = ["tests/trait_variant_pin.rs"]

[dependencies]
bytes.workspace = true
futures-core.workspace = true
thiserror.workspace = true
trait-variant.workspace = true
serde = { workspace = true, optional = true }
# Optional, and reachable only through the `serde` feature below — a payload
# encoder is not a thing the contract crate has an opinion about until somebody
# asks it to serialise one (WF-11, ADR-0016 §10).
base64 = { workspace = true, optional = true }

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std", "memory"]
std = ["thiserror/std", "bytes/std", "futures-core/std", "serde?/std"]
# Wire-format derives. Required by `happenstance-sync`; deliberately NOT on by
# default so the contract crate carries no serialization opinion.
# `serde/alloc` is stated rather than inherited. This crate is `no_std` and its
# derives need `alloc`; today `bytes/serde` happens to enable it, so omitting it
# compiles — until `bytes` changes that in a patch release, at which point the
# breakage lands in a downstream crate that changed nothing (D12).
#
# `base64/alloc` is stated for exactly the same reason, one crate over: the
# encoder returns a `String`, so `alloc` is not optional in practice, and
# `default-features = false` at the workspace level means nothing else turns it
# on. The D12 lesson generalises — a feature this crate needs is named here even
# when today's graph happens to supply it.
serde = ["dep:serde", "dep:base64", "base64/alloc", "bytes/serde", "serde/alloc"]
# The in-memory reference event store. Costs no extra dependencies and backs
# every doctest in this crate, so the docs cannot drift from the API.
memory = ["std"]
# **Retired, and gates nothing** (ADR-0063). From `0.2.0` until the lift it held
# the `ProjectionStore` port out of the semver promise; the port is unconditional
# now and frozen, on the evidence ADR-0062 produced — adapters at both ends of
# PS-2's batch-shape axis passing the suite. The name stays declared, empty,
# because a manifest written against `0.2.0` names it and removing a feature is
# a breaking change. It costs nothing to carry and turns nothing on.
unstable-projection = []
# `ProjectionProbe`, the write seam the projection conformance suite runs
# through. No `dep:` entry, no `std`, no `memory`.
#
# The cheapness is the whole economic argument for the trait living beside the
# port rather than in `happenstance-testkit`. An adapter's own `tests/` directory
# is a separate crate, where neither a testkit trait nor the adapter's type is
# local, so the orphan rule rejects `impl ProjectionProbe for MyStore` there and
# the only way out would be a **non-dev** dependency on the testkit. Here it
# costs one flag on a dependency the adapter already has and no new edge in its
# graph. If this line ever acquires a `dep:`, that argument is void and the
# placement is owed a new ADR.
#
# This list was `[]` until the gate landed, read `["unstable-projection"]` while
# the port sat behind that feature — the probe is *defined inside* the module
# the gate closed, so `conformance` alone had to imply it — and is `[]` again
# since ADR-0063 lifted the gate. The tripwire above now reads exactly as it
# was first written: a `dep:` or an implied feature here voids the placement
# argument and is owed a new ADR.
#
# What it implies nothing *else* on purpose: `conformance` without `memory`,
# and `conformance` under `--no-default-features` (which is `no_std`), are both
# combinations the feature powersets compile. A `conformance` surface that only
# works alongside `memory` is green on default features and on `--all-features`
# and is caught nowhere else.
conformance = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
