[package]
name = "happenstance-neon"
description = "Neon serverless Postgres event store for happenstance, over the one-shot /sql HTTP endpoint. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# `unstable-projection` is named rather than inherited. Feature unification is
# per build, and this crate is checked twice on its own — once for the host and
# once for `wasm32`, where nothing else is in the build to unify with.
# `unstable-projection` is NOT here, and its absence is the point: it is forwarded
# by the `projection-store` feature below rather than taken unconditionally. Held
# here it would reach every consumer of this crate whatever features they chose,
# which is how a gate that two other crates maintain gets walked around by a third.
happenstance-core = { workspace = true, features = ["std"] }
futures-core.workspace = true
# `std` is added rather than assumed: the workspace entry is
# `default-features = false` so members state what they need, and `serde_json`
# below already forces `std` into the graph.
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true

[features]
# The event store only. `projection-store` left this set with ADR-0036: it forwards
# an unfrozen port, and PS-3 says such a port ships behind an off-by-default flag.
default = ["event-store"]
# The transport and the error type are unconditional: they are the crate's
# actual contribution and both roles are written in terms of them.
event-store = []
# Forwards the contract crate's own gate, the way `happenstance-sqlite` does. It was
# empty while the dependency above carried the flag unconditionally — so the feature
# named the capability while doing none of the gating, and turning it off changed
# nothing a consumer could observe.
projection-store = ["happenstance-core/unstable-projection"]

[lints]
workspace = true
