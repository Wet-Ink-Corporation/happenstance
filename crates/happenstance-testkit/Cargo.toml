[package]
name = "happenstance-testkit"
description = "Conformance suites for happenstance event store and projection store adapters: the bar an adapter must clear to exist."
# Its own version, not the workspace's (CF-32). Adding a conformance rule is a
# semver-MINOR change that can turn a passing adapter's CI red, so this crate's
# number has to move on its own schedule — and a version inherited from the
# workspace cannot be separated later without a release that lies about what
# changed in it.
#
# Moved to 0.2.0 by the phase-4 freeze on exactly the reasoning above: that
# change added thirty-four rules, and thirty-four new ways for a previously
# passing adapter to go red is the event this crate's independent number exists
# to signal.
#
# It moved *down* to a pre-release for the alpha, which read as a mistake unless
# the reason was written here: CF-32 gives this crate an independent **number**,
# not an independent **maturity**, and a stable number would have promised
# adapter authors — who are told to pin this crate exactly — a bar that was still
# moving under them. That reservation is discharged rather than forgotten. The
# contract this suite measures is what went stable at `0.2.0`: the frozen
# `EventStore` clauses are semver-binding, and the rule set that checks them is
# no longer a moving target.
#
# The projection family is inside the same promise since ADR-0063: the port it
# checks is frozen, on the evidence of adapters at both ends of the batch-shape
# axis passing it. A projection rule appearing or changing is a minor bump here
# exactly as an event-store rule is.
#
# **Pin this crate exactly anyway.** A stable number does not make a new
# conformance rule harmless — it makes it *minor*, which is precisely the bump
# `cargo update` takes without being asked, and the one that turns a passing
# adapter red. That advice is in this crate's README and its rustdoc, and the
# number moving to `0.2.0` did not soften it, and `0.3.0` — the projection
# suite awaiting the moved probe seam, the same rules asked a new way — is
# exactly the bump that advice was written for.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/happenstance-testkit"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# `memory` moved here from `[dev-dependencies]` at the fixture contract: the
# testkit's own `MemoryFixture` is a *published* item in `fixtures`, not a test
# helper, because it is the reference implementation of `Fixture` an adapter
# author reads before writing their own.
#
# `conformance` arrived with the projection family and is on unconditionally
# rather than behind a feature of this crate's own. It gates `ProjectionProbe`,
# which `ProjectionFixture::Store` is bound on — so a testkit that made it
# optional would have a fixture trait that exists on some feature
# configurations and not others, and every projection item would need a `cfg`
# and a doc gate. It adds no dependency: the feature costs nothing in
# `happenstance-core`.
#
# `unstable-projection` was stated here rather than inherited through
# `conformance` while the port was gated — the D12 lesson one crate over, that a
# feature this crate needs is named even when today's graph supplies it. The
# port is unconditional since ADR-0063 and `conformance` implies nothing, so the
# list is the three features this crate actually turns on.
[dependencies]
happenstance-core = { workspace = true, features = [
  "std",
  "memory",
  "conformance",
] }
# Needed to spell `MemoryHandle`'s delegating `read` — the return type is
# `impl Stream<…> + Send`, and the trait it satisfies is defined in terms of
# `futures_core::Stream`.
futures-core.workspace = true

[features]
# `memory` is in `default` deliberately. `GappyMemoryStore` is gated on it, and a
# gate whose feature is never declared is an item that silently does not exist;
# a gate declared but left out of `default` is an item a `cargo add
# happenstance-testkit` user never meets. It forwards to a `happenstance-core`
# feature this crate already enables unconditionally above, so it adds no
# dependency and changes no resolution — what it buys is a switch
# `--no-default-features` can turn off, which is what keeps the feature powerset
# honest about a `#[cfg]` over a `pub` item (RS-51-1).
default = ["memory"]
memory = ["happenstance-core/memory"]
# The property-test generators in `fixtures::strategies` (CF-21). Off by
# default so the mandatory `wasm32` build stays untouched — `proptest` does not
# build for that target — and on under `--all-features`, which is what the
# gate's clippy, test and doc steps all run.
proptest = ["dep:proptest"]
# The benchmark family (`bench`, `event_store_benchmarks!`). CF-34: performance
# is measured by a *separate* harness which is not part of the conformance bar,
# so this feature buys a fourth macro family and **no** conformance rule.
#
# It adds no dependency — the empty list is the point, and NF-001 pins it. What
# a benchmark needs and this crate must not have is a clock: CF-33 forbids one
# anywhere under `src/`, and `xtask`'s `lint-clock` step enforces it by scanning
# for the construct. So the harness produces counts and the caller's emitter
# produces durations, with the measurement crate — `criterion`, `divan`, a CSV
# writer — living in the *caller's* `dev-dependencies`.
#
# Off by default, and the module is target-gated on top of that. A Cargo feature
# is not target-scoped, so `--all-features` reaches `wasm32-unknown-unknown`
# too; see `src/lib.rs`'s declaration and `fixtures.rs`'s note, which is the
# same trap `proptest` above paid for once already.
bench = []

# Split by target so the wasm harness can be *compiled* for wasm32 without
# dragging tokio's multi-threaded runtime — which cannot exist there — into the
# same check. The testkit's own library has no dev-dependency on either: the
# runtime attribute is emitted into the caller's crate, never resolved here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
