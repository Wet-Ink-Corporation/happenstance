[package]
name = "happenstance"
description = "DCB-compliant event sourcing with batteries: typed events, decision models and projection runners over a storage-agnostic contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/happenstance"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Excluded because they `include_str!` across the package boundary.
#
# These targets read `happenstance-core`'s `src/lib.rs`, its `Cargo.toml`, and the workspace `deny.toml` — files that exist in the workspace and not in the
# `.crate`. Nothing caught it: `cargo package --list` never compiles, and the
# verification build compiles the LIBRARY, not the packaged test targets. The
# tarball therefore built cleanly while carrying test files that cannot, and
# the person who finds that is a distro packager or an auditor running
# `cargo test` on an unpacked crate.
#
# The tests are kept and still run in the workspace, which is the only place
# their subject exists. `tests/boundary_refusal.rs` states the rule being
# obeyed here: "`include_str!` cannot cross the package boundary of a
# published crate".
exclude = [
    "tests/contract_surface.rs",
    "tests/manifest_contract.rs",
    "tests/retry_spelling.rs",
]

[dependencies]
# No `features` key here: each of the contract crate's four switches is
# re-declared in `[features]` below and forwards there unchanged in meaning, so
# nothing of the contract crate's is turned on behind a consumer's back. Turning
# one on from this line instead would make `happenstance` enable a contract-crate
# feature that a consumer reading `[features]` cannot see, which is the kind of
# difference nobody discovers until a no_std build fails three crates away.
#
# That is a claim about *forwarding*, not about parity, and the difference is not
# pedantry — an earlier version of this comment said the two crates have "exactly
# the switches" one another has, which is false: `json`, `postcard` and `cbor`
# exist only here and `conformance` only there, and `json` is in these defaults,
# so `default-features = false` is not the same act on the two crates.
# `manifest_contract.rs` derives that set from both manifests and fails this file
# and the README if either claims otherwise.
happenstance-core = { workspace = true }
# The typed layer's whole job is encoding, so `serde` is a real, unconditional
# dependency here. ADR-0003 forbids it in `happenstance-core`'s defaults and says
# nothing about this crate; ADR-0006 made this the typed layer. Both are already
# `[workspace.dependencies]`, so no new crate enters the graph.
serde = { workspace = true }
thiserror = { workspace = true }
# Derives `SendProjection`, the `Send` flavour of `Projection`, from the one
# trait this crate writes (ADR-0074 decision 1), as `happenstance-core` derives
# its ports' flavours. The requirement is the workspace's caret, which ADR-0092
# keeps and answers with the derivation contract in `src/derivation.rs`.
#
# Unconditional, as the runner it derives a flavour for is since `0.5.0`: it
# adds no node to any dependency graph, because `happenstance-core` already
# depends on it unconditionally.
trait-variant = { workspace = true }
# One optional crate per codec, each reached only through the feature that names
# it with `dep:` below. A bare `serde_json/std` inside a feature would enable the
# dependency as a side effect, which is how a feature ends up shipping a crate
# nobody asked for.
serde_json = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
# Naming `Stream` is unavoidable for a runner that pulls a replay item by item
# instead of buffering it, and `EventStore::read` returns the stream at the top
# level precisely so it can be pulled. Unconditional since `0.5.0`, because the
# runner is: it is in every build of this crate.
#
# It adds no node to any dependency graph: `happenstance-core` already depends on
# it unconditionally, and this crate already depends on `happenstance-core`
# unconditionally, so `cargo tree` is unchanged by this line (RS-50-1 counts
# nodes, not manifest entries). The test targets use it too: `tests/flavours.rs`
# and the command loop's recording/violating wrapper are hand-written
# `impl EventStore`s, which name `Stream`, so no dev-dependency line repeats
# this one.
futures-core = { workspace = true }

[dev-dependencies]
# Also a real dependency below, behind `json`. Declared here as well so this
# crate's own test targets link it in *every* feature configuration — a test
# that only compiles when a feature is on is a test the powerset drops.
serde_json = { workspace = true }
# The async harness the store-facing tests and the crate root's first program
# run on. Dev-only: nothing a consumer links, and no `Send` bound reaches the
# port through it. `rt-multi-thread` because `tests/flavours.rs` spawns the
# command loop onto a real work-stealing runtime, which is the only place the
# `Send` flavour's bounds are actually tested rather than asserted.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# `FaultyStore`, for the retry demonstration that needs no database.
#
# Deliberately **not** `{ workspace = true }`, and this is NF-006 rather than an
# oversight. Until ADR-0057 (`0.4.0`) the root's entry carried a version on the
# testkit, and a dev-dependency carrying a version has to resolve from the
# registry at publish time — which would make `happenstance-testkit` publish
# *before* `happenstance`, a coupling CF-32's independent version number exists
# to avoid. Cargo strips a versionless dev-dependency from the published
# manifest entirely, so the path-only spelling is what keeps the two crates'
# release order free. The root entry is versionless now, so `workspace = true`
# would be equivalent, and `package-check` refuses a versioned line either way.
happenstance-testkit = { path = "../happenstance-testkit" }

[features]
# `json` joins the defaults so a first program names a domain before it names an
# encoding. It adds a type and takes nothing away.
default = ["std", "memory", "json"]
std = ["happenstance-core/std", "thiserror/std", "serde/std"]
# Unchanged in meaning: it forwards the *contract crate's* envelope `serde`,
# which is what replication needs. It is deliberately not repurposed to gate this
# crate's own `serde` dependency — a feature only ever adds, and turning this one
# into a switch over `Codec` would change what an existing flag means.
#
# Read the two spellings carefully, because they share a name and are not the
# same thing. `serde` the *crate* is an unconditional dependency above: the
# `Codec` trait's bounds are ungated, so every build has it. `serde` the
# *feature*, here, is `happenstance-core`'s wire-format derives and nothing else.
serde = ["happenstance-core/serde"]
memory = ["happenstance-core/memory"]
# The three codecs. Each turns on exactly one optional dependency and one unit
# struct; none of them changes what any other feature means.
json = ["dep:serde_json"]
postcard = ["dep:postcard"]
# `cbor` ships because the verdict came back before the dependency landed:
# `cargo deny check licenses` passes for `ciborium`'s whole subtree against this
# workspace's allowlist, which was read and not widened. Had it refused, the
# alpha would have shipped `json` + `postcard` and this line would be the reason
# it did not.
cbor = ["dep:ciborium"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
