[package]
name = "happenstance-cloudflare"
description = "Cloudflare Durable Object (Workers SqlStorage) event store adapter for happenstance. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
happenstance-core = { workspace = true, features = ["std"] }
futures-core.workspace = true
thiserror.workspace = true
# NOTE, replacing the note that used to stand here rather than deleting it. The
# reversed trade, both halves, because a reviewer checks the swap against the
# reasoning for the state it replaced:
#
# *What the stand-in bought.* `worker` was deliberately absent, on the argument
# that it drags a large `wasm-bindgen`/`js-sys`/`web-sys` surface and its own
# licence graph through `cargo deny` on every run of the gate "for no
# type-checking benefit": the shape the skeleton had to pin was `!Send`,
# `!Sync`, a synchronous `exec` and a cursor that is not a snapshot, and
# `js::JsHandle` plus `sql_storage` modelled exactly that and nothing else.
#
# *What reversing it costs, measured rather than feared.* The graph gains 40
# crates (`http`, `matchit`, `strum`, `serde-wasm-bindgen`, `wasm-streams`,
# `web-sys`, `url` and their leaves); `wasm-bindgen`, `js-sys` and
# `wasm-bindgen-futures` were already there as `wasm-bindgen-test`'s transitive
# dependencies, so those three are new *edges* to existing *nodes*.
# `cargo deny check licenses advisories` is green against `deny.toml`'s
# unmodified eight-licence allowlist, and `worker`'s declared
# `rust-version = "1.75"` sits well under ADR-0029's 1.97.1 floor.
#
# *And one price that is not paid yet, stated because a silent one is how a
# guard dies.* `cargo deny check bans` is **red**: `deny.toml` bans
# `async-trait` (ADR-0001 — it injects `+ Send`, which forecloses wasm32), and
# `worker` 0.8.5 depends on it unconditionally, as does `worker-macros`. The
# ban's own comment says such a route "fails until someone decides it should"
# be a wrapper, and that decision is not this manifest's to take: widening the
# `wrappers` list here would turn the measurement into a green checkmark and
# delete the finding. So the finding stands, recorded against AC-008 in
# `worker-binding-layer/_ledger.md` and escalated to ADR-0023
# (`adr-0023-and-atom-resolutions`), which is where the wrapper entries land if
# they are ratified.
#
# What it does *not* mean, since a red ban invites the wrong inference:
# `worker` uses `#[async_trait]` for its own `DurableObject` trait, and no
# happenstance port gains a bound from it. `happenstance-core` still declares
# each port once without a `Send` bound and lets `trait_variant` derive the
# second flavour, and the substantive guards are unmoved —
# `crates/happenstance/tests/flavours.rs` and this crate's `!Send` probes, which
# now run on `wasm32` as well as on the host.
#
# *What it buys.* The argument that this dependency has no type-checking
# benefit was true of a crate whose every body was `todo!()` and false of one
# that talks to a Durable Object. `worker::Error` is the real thrown value ES-6
# is a claim about, and `worker::SqlStorage` is the API the four modelled
# properties were modelling. An instrument that models the runtime cannot be
# falsified by the runtime.
worker.workspace = true

# The conformance suite this adapter is measured by, and it is deliberately
# **not** target-scoped while `wasm-bindgen-test` below is.
#
# `wasm-bindgen-test` has to be target-scoped because the attribute it carries
# resolves in the caller's crate: a host `cargo test` must not have to resolve
# it at all. `happenstance-testkit` is the opposite case. `Fixture`'s five
# associated constants — `SECOND_HANDLE`, `REOPEN`, `MID_BATCH_FAULT` and the
# three `Option<usize>` ceilings — are *facts about this adapter* that need no
# JavaScript heap to read, and the tests that hold them honest are the ones an
# ordinary contributor runs in their inner loop with no wasm toolchain
# installed. Target-scoping this row would have put every one of those
# assertions behind a runner, which is exactly the "compiled by the gate,
# executed by nothing" shape the previous milestone spent its budget ending.
#
# Nothing lands in `[dependencies]`: a dev-dependency does not travel to a
# consumer, so the runtime graph `cargo deny` and `cargo hack` see is unchanged
# by both rows.
[dev-dependencies]
happenstance-testkit.workspace = true
# Named here as well as in `[dependencies]` because an integration target is a
# second compilation unit: it links this crate and this crate's *dev*-graph, and
# a regular dependency of the library is not in its extern prelude.
happenstance-core = { workspace = true, features = ["std"] }
futures-core.workspace = true

# `wasm-bindgen-test` is target-scoped for the reason
# `crates/happenstance-testkit/Cargo.toml`'s block gives: the runtime attribute
# resolves in the caller's crate, never in the testkit, and a host `cargo test`
# must not have to resolve it at all. It is what emits the `wasm32` twin of the
# `!Send` probes — the detector has to live on the target where the auto-trait
# leak it exists to catch can actually appear.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
