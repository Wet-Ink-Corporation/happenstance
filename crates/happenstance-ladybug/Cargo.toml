[package]
name = "happenstance-ladybug"
description = "LadybugDB graph projection store adapter for happenstance. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
happenstance-core = { workspace = true, features = ["std"] }
thiserror.workspace = true

# NOTE: the `lbug` crate is deliberately NOT a dependency yet. It compiles
# LadybugDB's C++ via cxx and cmake from source, which would put a multi-minute
# native build on every `cargo check` of this workspace. It gets added in the
# pass that implements the adapter — which is also the reason this lives in its
# own crate rather than behind a feature of another one.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
