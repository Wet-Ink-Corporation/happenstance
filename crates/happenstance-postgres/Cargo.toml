[package]
name = "happenstance-postgres"
description = "Postgres event store and projection store adapters for happenstance. Not yet implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# `unstable-projection` is named rather than inherited. Feature unification is
# per build, and the `-p` doc step and every `cargo hack` combination build this
# crate on its own.
# `unstable-projection` is NOT here, and its absence is the point: it is forwarded
# by the `projection-store` feature below rather than taken unconditionally. Held
# here it would reach every consumer of this crate whatever features they chose,
# which is how a gate that two other crates maintain gets walked around by a third.
happenstance-core = { workspace = true, features = ["std"] }
futures-core.workspace = true
thiserror.workspace = true
# `postgres` is the driver; `runtime-tokio` is the reactor. Nothing else — no
# TLS backend (see the workspace table), no `macros` (compile-time query
# checking needs a live `DATABASE_URL`, and this crate has none), and still no
# `migrate`.
#
# That last one stopped being "the schema is prose until phase 10 makes it real"
# and became a decision. The schema is now real — `migrations/0001_event_log.sql`
# — and it is applied by `include_str!` and one `execute`, not by `sqlx::migrate!`.
# Two reasons, and the second is the one that decided it. The version-tracking a
# migrator buys is worth nothing against a single migration applied to a schema
# created seconds earlier and dropped at the end of the run; and `migrate` carries
# its own `_sqlx_migrations` bookkeeping table, which is *per schema* and would
# therefore be created once per fixture instance under the schema-per-instance
# isolation this crate's tests use — bookkeeping about a history that, by
# construction, is one row long. The one-migration discipline ends at first
# publish, which is `publication-and-positioning`'s to decide; a migrator can be
# turned on then, in the release that needs it.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
# Not dev-only, and the move is deliberate. `read` hands its cursor-opening work
# to the runtime on the first poll rather than polling it inline, because ES-11
# requires the read's state to be fixed no later than that poll and a future that
# only advances while someone is polling it is fixed whenever the caller next
# gets round to it. `Handle`, `spawn` and `JoinError` are therefore named in this
# crate's own code and its error enum. `rt` only: nothing here starts a runtime,
# it joins the one the caller is already on. `happenstance-sqlite` carries tokio
# for the same reason one layer down.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
happenstance-testkit.workspace = true
# `rt-multi-thread` is not decoration: the concurrency family starts
# `CONTENDERS` contenders, and a current-thread runtime turns that family from a
# race into a queue.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
# The live server the fixture talks to. Dev-only, so it reaches no consumer; see
# the workspace table for the pin, the licence verdict and why this is not
# `testcontainers-modules`.
testcontainers.workspace = true

[features]
# The event store only. `projection-store` left this set with ADR-0036: it forwards
# an unfrozen port, and PS-3 says such a port ships behind an off-by-default flag.
default = ["event-store"]
# One driver, one pool, one connection story, so the two roles share a crate and
# are separated by features rather than by another package — the same split
# `happenstance-sqlite` makes, for the same reason.
event-store = []
# Forwards the contract crate's own gate, the way `happenstance-sqlite` does. It was
# empty while the dependency above carried the flag unconditionally — so the feature
# named the capability while doing none of the gating, and turning it off changed
# nothing a consumer could observe.
projection-store = ["happenstance-core/unstable-projection"]

[lints]
workspace = true
