[package]
name = "happenstance-sync-testkit"
# The placeholder's words, held to them by `xtask/src/reserve.rs`'s
# `a_crate_with_a_readme_carries_what_the_placeholder_carries`.
description = "Conformance suite for happenstance replication peers."
# The workspace's number, in lockstep, until 1.0 (#108 part E, D3). CF-32 gives
# `happenstance-testkit` its own number so a new rule can be a minor of it;
# ADR-0066 §4 says the same of this crate, and lockstep keeps that true while
# the whole workspace is `0.y`: a new rule here is a minor of the one number.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/happenstance-sync-testkit"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Published since #108 part E, and still growing: phase 13 adds rules, each a
# minor of this crate. Pin it exactly, as `happenstance-testkit`'s README says
# of that crate.

[dependencies]
happenstance-core = { workspace = true, features = ["std"] }
# `memory`, because `MemorySyncFixture` is a published item of this crate, not a
# test helper: it is the reference implementation of `SyncFixture`, and the peer
# every rule is proven against before it is allowed to fail an adapter.
happenstance-sync = { workspace = true, features = ["memory"] }
# `RuleOutcome` and `block_on`, so that a skip is reported in exactly the words
# the event-store and projection families use, and one blocking driver serves
# every family. Phase 1's registry, inherited rather than copied.
#
# A normal dependency, so it carries a version: a published crate's normal
# edge resolves from the registry. The version is the testkit's own key
# (`crates/happenstance-testkit/Cargo.toml`, CF-32), not the workspace's, and
# moves with it. The root entry stays versionless for the dev-dependencies
# ADR-0057 is about, so this line spells its own path rather than inheriting.
# `RuleOutcome` is part of this crate's public API through every rule's
# signature, which is the decision publishing it took (#108 part E, D4).
happenstance-testkit = { version = "0.4.4", path = "../happenstance-testkit" }

[features]
# The model family (`sync_model`): seeded peer topologies driven through push
# and pull from one seed, checked at quiescence against a model of its own.
# Off by default, because `proptest` does not build for wasm32 and this crate
# has a wasm32 harness; the gate's `--all-features` steps turn it on. The same
# split `happenstance-testkit`'s `proptest` feature makes, for the same reason.
proptest = ["dep:proptest"]

# Target-scoped as well as optional: a Cargo feature is not target-scoped, so
# `--all-features` reaches `wasm32-unknown-unknown` too, and the dependency has
# to be absent there whatever the feature says.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest = { workspace = true, optional = true }

[[test]]
name = "memory_sync_model_conformance"
required-features = ["proptest"]

[[test]]
name = "wrong_topologies"
required-features = ["proptest"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
