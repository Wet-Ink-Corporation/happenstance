[package]
name = "outside-projection-adapter"
description = "An outside author's projection store adapter, written from the published documentation, so the extension surface is met by somebody who did not build it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Deliberately **not** `workspace = true`, and this is the one manifest in the
# repository where that is the right call. The crate exists to model what an
# outside author's manifest looks like, and the claim under test is a claim
# about this file: *"one feature flag on a dependency the adapter already has,
# and no new edge in the dependency graph"*. `[workspace.dependencies]` sets
# `default-features = false` on `happenstance-core` for reasons internal to this
# workspace, so `workspace = true` would force `std` to be spelled here as if it
# were a second feature an outsider had to ask for — and would report a cost
# that a `cargo add happenstance-core` user does not pay. Written out long-hand,
# the line is the line an outsider writes, minus the `path`.
[dependencies]
# The requirement moves with the workspace version, and it has to: a `"0.2.0"`
# requirement does not match a `0.2.0-alpha.1` candidate, so the whole workspace
# stops resolving — which is the same failure `Cargo.toml`'s own requirement
# strings would have caused at publish time, arriving here first because this
# manifest is written long-hand on purpose. An outsider adding a pre-release
# writes the pre-release, so the line is still the line they would write.
#
# `unstable-projection` and not `conformance`, and the difference is the whole
# of what this file models. `unstable-projection` is what the *store* needs —
# `ProjectionStore`, `Checkpoint`, `Authority`, `CommitError`, `ResetError` and
# `ProjectionId` are all behind it, and none of them is in the contract crate's
# default set — so it is unconditional here and an adapter cannot make it
# optional without making its own port impl optional too. `conformance` is what
# the *probe* needs, it is nobody's business but a suite runner's, and it is
# therefore forwarded from a feature of this crate rather than turned on here.
#
# The recipe's own fence writes `happenstance-core = "…"` with no features
# named at all, which does not compile for the reason above; that is the
# recipe's gap rather than this manifest's licence to deviate, and it is
# recorded in `tests/outside_projection_manifest.rs`'s limits.
happenstance-core = { version = "0.2.0-alpha.1", path = "../../crates/happenstance-core", features = [
  "unstable-projection",
] }

# The one flag this crate declares, and it is declared because the published
# recipe says to declare it (`happenstance_core::ProjectionProbe`'s own rustdoc).
# Forwards to the contract crate; the `impl ProjectionProbe` blocks live in
# `src/` under `#[cfg(feature = "conformance")]`, because a crate cannot `cfg`
# on a dependency's feature — which is also why a `[dev-dependencies]` entry
# would not work: it does not exist for the lib build the impls compile in.
#
# It costs the feature powerset one further combination for this member, and
# that is the trade. The story that built this crate declined it, on the ground
# that the crate should declare no features of its own; what that reasoning
# missed is that the feature table *is* part of the surface being falsified.
# A falsifier that skips the one manifest shape the surface prescribes has
# falsified everything except the recipe. Off by default, so a consumer of this
# crate — and there is none, but the shape is the point — does not inherit
# `unstable-projection`'s conformance half without asking.
[features]
conformance = ["happenstance-core/conformance"]

# The whole of the testkit's cost, and it lands here rather than above. The
# crate documentation states this pair up front: the suite, and `tokio` with
# `macros` and `rt` for the default emitter's `#[tokio::test]`, which resolves
# in *this* crate's scope rather than in the testkit's.
[dev-dependencies]
happenstance-testkit = { version = "0.2.0-alpha.1", path = "../../crates/happenstance-testkit" }
tokio = { version = "1", features = ["macros", "rt"] }

# Held to the workspace's own lint bar rather than to rustc's defaults. An
# outside author would write their own; borrowing this one is the stricter
# choice, and it is what keeps `#[async_trait]`, a `Send`-flavour binding and an
# ambiguous import from passing review here when they would fail anywhere else
# in the tree.
[lints]
workspace = true
