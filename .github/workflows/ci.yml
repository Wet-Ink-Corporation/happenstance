name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue. A queued pull request is tested as the commit it would
  # become: its head merged onto the tip of `main` and every entry ahead of it
  # in the queue. That is what "require branches to be up to date" was buying,
  # bought once per merge instead of once per merge *per open pull request*: at
  # the pace this repository runs, the old rule sent every other open branch
  # back through a full run on every merge. The queue run is also the backstop
  # that lets a pull request's own run skip what its diff cannot affect
  # (`changes`, below): whatever a pull request skipped, the queue runs before
  # `main` moves.
  merge_group:
  workflow_dispatch:
    # Read by `floating-deps` alone, the last job in this file, and false unless
    # ticked by hand. It makes that job red on purpose, once, so the red is seen
    # before the job's green is trusted (ADR-0092).
    inputs:
      floating_deps_prove_red:
        description: "floating-deps only: resolve a trait-variant with its blanket impl cut out, so the derivation contract must fail"
        type: boolean
        default: false
  # 07:17 on Tuesdays, driving `advisories` and `floating-deps` below. The offset is
  # deliberate: GitHub queues the whole fleet's scheduled workflows on the hour
  # and again at midnight UTC, and a run submitted into that queue is delayed by
  # tens of minutes or silently dropped. Nothing here is time-sensitive to the
  # minute, so an odd time costs nothing and buys a run that actually starts.
  schedule:
    - cron: "17 7 * * 2"

# What the `GITHUB_TOKEN` handed to every job below may do. Stated here rather
# than inherited, and that is the whole of it: with no `permissions:` key the
# token takes the *repository's* default scope — a setting changed in the web UI,
# by someone who is not reading this file, and historically read-write on a
# repository created before GitHub flipped the default. Every step here reads the
# tree and nothing writes to the repository, so `contents: read` is what the jobs
# need and the rest is blast radius. A job that genuinely needs more raises it at
# the job, where a reviewer reads the grant beside the steps that use it; none
# does today.
#
# The credential this does *not* govern is `REDKILN_TOKEN` in the `backlog` job.
# That is a separate fine-grained token with read-only Contents on one sibling
# repository, and its scope lives at the organisation rather than here.
#
# `cargo xtask lint-workflows` is what keeps this key present — in every workflow
# this repository grows, not only in this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  # `github.event_name` belongs in the key because the weekly advisories run and
  # a push to main resolve to the same `github.ref`. Without it,
  # `cancel-in-progress` lets the scheduled job cancel a gate run that was
  # mid-flight — a green tick on main that no gate ever produced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request's diff can affect, decided once for the jobs below.
  #
  # `code` is `false` only on a `pull_request` event whose every changed path is
  # prose: documentation, the site, the runbook, the knowledge base, the
  # specification, the constitution, the references and the frozen trees. On
  # such a run the jobs that exercise built code against something outside the
  # gate (the live endpoints, workerd, the MSRV, semver, the benchmarks) skip,
  # and the gate runs in full on Linux only. Every other event says `true`, and
  # so does every failure to decide.
  #
  # Two things keep a skip honest. First, the queue: a `merge_group` run always
  # says `true`, so nothing reaches `main` that skipped anything. Second, fail
  # OPEN. A required check that is *skipped* reads as passing, so a dependent
  # gated on this job succeeding would turn a broken `changes` job into a row of
  # green ticks over nothing. The dependents therefore run on `!cancelled()` and
  # skip only on an explicit `false`; an empty output, from a job that failed,
  # runs everything.
  #
  # The list is of paths that are prose, not of paths that are code, so a new
  # top-level directory is code until someone says otherwise here. `standards/`
  # and `spec/` are prose for this purpose though the gate reads both: the gate
  # still runs on Linux, which is where `spec-trace`, `lint-constitution` and the
  # constitution's doctests make the same claim on every runner.
  changes:
    name: what the diff can affect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # Depth 2 is enough: a `pull_request` run checks out the merge of the head
      # onto the base, whose first parent is the base tip, so `HEAD^1..HEAD` is
      # exactly the pull request's change as it would land. `--no-renames`,
      # so a file moved out of `crates/` into `docs/` lists both ends.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "${{ github.event_name }}: every job runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD) || [ -z "$files" ]; then
            echo "::warning::could not list the changed paths; every job runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prose='^(docs|site|runbook|references|\.kb|spec|standards|\.bklg|\.redkiln|assets)/|^[^/]+\.md$'
          code_paths=$(grep -vE "$prose" <<<"$files" || true)
          if [ -n "$code_paths" ]; then
            echo "paths that are not prose:"
            echo "$code_paths"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::every changed path is prose; the jobs that exercise built code skip here and run in the merge queue"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The whole gate, defined once in xtask/src/main.rs rather than duplicated
  # here. `cargo xtask ci` is the same command contributors run locally.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    env:
      # The full gate everywhere, except on a prose-only pull request, where
      # macOS and Windows report green having run nothing but the line below
      # that says so. They are the slowest two rows of every run, the gate's
      # prose checks are not OS-dependent, and the merge queue runs all three.
      FULL_GATE: ${{ matrix.os == 'ubuntu-latest' || needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is first-class: the local-first application this library was
        # written for ships there.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Whether this runner runs the gate
        if: env.FULL_GATE != 'true'
        run: echo "::notice::prose-only pull request; the gate runs on ubuntu-latest here, and on every runner in the merge queue"

      # Full history, for one gate step: `no accepted decision's body has changed`
      # (`xtask/src/lint_kb.rs`) reads `.kb/decisions/` at the base commit, and the
      # default `fetch-depth: 1` leaves that commit out of the clone — the `semver`
      # job below says the same for the same reason. The step refuses to run on a
      # shallow clone rather than skipping, so removing this makes the gate red.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.FULL_GATE == 'true'
        with:
          fetch-depth: 0

      # rust-toolchain.toml pins the channel, the components and the
      # wasm32 target, so there is nothing to configure here.
      #
      # The SHA is the head of that action's `stable` BRANCH, not a release tag:
      # dtolnay/rust-toolchain publishes no version tags, and its branches are
      # the same action differing only in `action.yml`'s default `toolchain`
      # input — `stable` on this one. So pinning freezes the default along with
      # the code, which is what `@stable` meant and no longer leaves to whoever
      # can push to that branch. Raising it is `git ls-remote` on the branch,
      # and the date beside it says what the pin is behind.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
        if: env.FULL_GATE == 'true'

      # Node 24, for the wasm32 steps that run `happenstance-cloudflare`'s shim.
      # The shim opens `node:sqlite` with `workerd`'s statement limits
      # (`compoundSelect`, `variableNumber`, `sqlLength`, `exprDepth`), and
      # refuses to open on a Node that ignores them. The `limits` option is in
      # Node 24's `node:sqlite` and not in 22's, and every runner image's default
      # is 22 (Ubuntu 24.04: 22.23.3; macOS 15: 22.23.2). ADR-0079.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.FULL_GATE == 'true'
        with:
          node-version: "24"

      # A second toolchain on the runner, for exactly one step of the gate: the
      # `--cfg docsrs` rustdoc build. It earns its place because
      # `#![cfg_attr(docsrs, feature(doc_cfg))]` is an *unstable* feature whose
      # spelling has moved before, and `docsrs` is a cfg nobody sets except
      # docs.rs — which builds *after* the crate is published. A crates.io
      # release can be yanked but never edited, so a broken `doc_cfg` is the one
      # class of breakage that cannot be fixed after the fact. Without this step
      # the check probes for a toolchain that is not there and prints `skipped`
      # on every runner, which is worse than not claiming it at all.
      #
      # Deliberately `rustup` rather than a second `dtolnay/rust-toolchain@…`:
      # that action makes whatever it installs the *default* toolchain, so the
      # pair would be order-sensitive and a misordering would quietly run clippy,
      # the tests and the rest of the gate on nightly. `rustup toolchain install`
      # installs and stops. `--profile minimal` is enough — rustdoc ships in the
      # `rustc` component, not in `rust-docs`.
      #
      # `cargo +nightly-…` reaches it despite rust-toolchain.toml's
      # `channel = "1.97.1"`: a `+toolchain` argument is the highest-precedence
      # override rustup has, above the environment, directory overrides and the
      # toolchain file. The pin does not neuter this step; do not delete it
      # believing that it must.
      #
      # On all three runners rather than only Linux. The property is
      # toolchain-dependent and not OS-dependent, so two of the three builds
      # prove nothing new — but the gate is one command defined once in xtask,
      # and the alternative is a matrix exception here plus a hedged "nothing is
      # skipped in CI" there. A `skipped` line that is expected on two runners is
      # a `skipped` line nobody reads on the third. Uniformity is worth the
      # minute.
      #
      # `--target wasm32-unknown-unknown` is load-bearing and was missing until
      # the first pull request ran this job. `rust-toolchain.toml`'s `targets`
      # key applies to the *pinned* toolchain, not to a second one installed
      # beside it, so nightly arrived with a host std and nothing else — and the
      # wasm32 half of the step below then failed with `can't find crate for
      # core`, which reads like a broken crate and is a missing target. It went
      # unseen because a lane-branch push runs no CI and every local machine
      # that had run the step already had the target installed for nightly.
      - name: Install nightly, for the docs.rs configuration step
        if: env.FULL_GATE == 'true'
        run: rustup toolchain install nightly-2026-10-31 --profile minimal --target wasm32-unknown-unknown # xtask's NIGHTLY, and must match it (#364)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.FULL_GATE == 'true'
        with:
          # Saved from `main` only, restored everywhere. The cache store is
          # 10 GB per repository and evicts least-recently-used; a cache saved
          # per pull request branch, three runners wide, pushes out the `main`
          # entries every branch restores from. A branch still restores `main`'s.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install supplementary tools
        if: env.FULL_GATE == 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-hack,cargo-deny

      # `wasm-bindgen-cli` must match the `wasm-bindgen` version in the
      # dependency graph *exactly* — the runner refuses to run against a
      # mismatched schema, and it is right to. Reading it out of Cargo.lock
      # rather than hard-coding it means a `cargo update` cannot leave this job
      # installing a runner that no longer matches, which would fail as a
      # confusing runtime error rather than as a version bump. The gate makes
      # the same comparison itself (`xtask/src/proof.rs`'s
      # `check_wasm_runner_version`), so a drift between these two is reported
      # by name rather than part way through a test binary.
      #
      # `shell: bash` because the default shell on `windows-latest` is
      # PowerShell and this is one script for three runners. `jq` ships on all
      # three GitHub-hosted images.
      #
      # Moved here from the standalone `wasm-conformance` job this replaces, and
      # the move is the point: that job ran on `ubuntu-latest` alone while this
      # one matrices over three. See the retirement note below.
      - name: Resolve the wasm-bindgen version from Cargo.lock
        if: env.FULL_GATE == 'true'
        id: wasm-bindgen
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          test -n "$version" || { echo "wasm-bindgen absent from the graph"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What this buys, stated because it is easy to read as optional: the
      # gate's `wasm32 run of the conformance rules` step is PROBED, so a runner
      # that is absent makes it print `skipped:` rather than fail. Installing it
      # on every matrix runner is what makes "the conformance rules execute on
      # wasm32" a claim CI actually makes. Deleting this step does not turn the
      # gate red — it turns that claim into a lie, silently, which is why the
      # step's own comment in `xtask/src/main.rs` points back here.
      - name: Install the wasm32 conformance runner
        if: env.FULL_GATE == 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

      - name: Run the gate
        if: env.FULL_GATE == 'true'
        run: cargo xtask ci
        env:
          # The base `lint-kb` compares accepted decisions against: the pull
          # request's base commit, or the previous tip on a push. Empty on a
          # schedule or a manual run, where the step falls back to the merge base.
          HS_KB_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  # The backlog and the knowledge base, checked by the tool that owns them.
  #
  # Deliberately NOT a step of `cargo xtask ci`. The gate is one command defined
  # once in Rust, and folding a Node CLI into it would make every contributor's
  # `cargo xtask ci` depend on a JavaScript toolchain to check files rustc never
  # opens. The two are separate jobs because they are separate claims.
  #
  # What it catches that nothing else does: a `.kb` atom whose frontmatter stops
  # validating, an accepted decision edited instead of superseded, an item whose
  # system frontmatter was hand-edited with the `PreToolUse` hook disabled, and a
  # `.redkiln/templates/` customisation silently reverted by `adopt --templates`.
  # Every one of those merges green today.
  backlog:
    name: backlog and knowledge base
    runs-on: ubuntu-latest
    # ══ DISABLED, 2026-09-04, and disabled LOUDLY rather than deleted ══
    #
    # This repository has moved off the redkiln version this job pins, and the
    # pinned CLI therefore reports drift against a process the repository no
    # longer runs. It is turned off until the next version stabilises, so that
    # `0.2.0` is not gated on a tool disagreement that says nothing about the
    # library.
    #
    # `if: false` rather than deleting the job, and that choice is this job's own
    # argument applied to itself. Its comment below says a backlog check that
    # quietly stops running is worth less than no backlog check, *because the
    # green tick keeps arriving*. A deleted job vanishes from the checks list; a
    # false-gated one shows as **skipped**, which is visible. Nothing here gets a
    # passing tick it did not earn.
    #
    # WHAT IS UNCHECKED WHILE THIS IS OFF, stated so it can be weighed:
    #   * a `.kb` atom whose frontmatter stops validating;
    #   * an item whose `.kb` atom is malformed in a way `validate --kb` reads;
    #   * an item whose system frontmatter was hand-edited with the `PreToolUse`
    #     hook disabled;
    #   * a `.redkiln/templates/` customisation reverted by `adopt --templates`,
    #     and the assertion that the drift set is exactly the six documented files.
    # Every one of those merges green while this job is off. That is the cost.
    #
    # ══ ONE ITEM WAS REMOVED FROM THAT LIST AT THE `0.2.0` PASS ══
    #
    # It read "an accepted decision atom edited instead of superseded — the
    # immutability rule `validate --kb` is the only enforcement of". Both halves
    # were wrong, and in the same direction: they overstated what turning this
    # job back on would buy.
    #
    # `validate --kb` compares an atom's body against the file as `HEAD` has it.
    # Verified by editing an accepted atom and running it: it reports "accepted
    # decision 'kb-decision-0042' was edited in place" on the UNCOMMITTED change.
    # So it passes the moment that edit is committed — and a CI checkout's
    # working tree *is* `HEAD`. This half has never been able to fire in this
    # job, before or after it was switched off, and switching it on would not
    # change that. The check is real and its reach is **pre-commit**.
    #
    # Enforcing it here needs a different instrument: a diff of every
    # `status: accepted` atom body against the merge base. That does not exist,
    # and naming it is worth more than a list entry that reads as coverage.
    #
    # The same correction settles a claim made about this job by the `0.2.0`
    # certification review — that it was the check which would have caught three
    # ADRs the specification cites as amending authority while none of the three
    # had an atom. It would not have. `validate --kb` exits 0 at `HEAD` today; it
    # validates the atoms that EXIST, and a record in `references/adr/` with no
    # atom is invisible to it. Nothing in this repository, enabled or disabled,
    # resolves the status of a cited ADR.
    #
    # TO RE-ENABLE: restore the `if:` expression preserved immediately below, and
    # raise `ref:` on the CLI checkout in the same commit — never separately, for
    # the reason the `ref` comment gives.
    #
    #   if: >-
    #     github.event_name != 'pull_request' ||
    #     github.event.pull_request.head.repo.full_name == github.repository
    #
    # The preserved expression is the fork carve-out: GitHub does not pass
    # secrets to a workflow triggered from a fork, so `REDKILN_TOKEN` is
    # unreachable rather than unset there, and a job failing for a reason a
    # contributor cannot act on teaches them only that this project's CI is
    # broken. A missing secret on a same-repository push still turns the job RED.
    if: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # redkiln is a Claude Code plugin in this organisation's private redkiln
      # repository — it is not on npm, and a workflow's built-in `GITHUB_TOKEN`
      # is scoped to its own repository and cannot read a sibling even inside one
      # org. So this needs a real credential: an organisation secret named
      # `REDKILN_TOKEN`, a fine-grained token with read-only Contents on
      # `Wet-Ink-Corporation/redkiln`. Set it once at the org and every repo that
      # adopts redkiln inherits it.
      #
      # Absent, this job is RED rather than skipped. That is the point: a backlog
      # check that quietly stops running is worth less than no backlog check,
      # because the green tick keeps arriving. The single exception is a fork's
      # pull request, where the secret is unreachable rather than unset; the
      # job-level `if` above carves that case out and says why.
      #
      # `ref` is pinned to a tag, and pinning is load-bearing rather than
      # cautious. `doctor` reports template and process drift by comparing this
      # repository's pinned `.redkiln/` against the BUNDLED files of whichever
      # CLI runs — so an unpinned checkout would change the expected drift set
      # under the assertion below whenever redkiln released. Raise this in the
      # same commit that upgrades the local plugin, never separately.
      - name: Check out the redkiln CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Wet-Ink-Corporation/redkiln
          ref: v0.18.0
          token: ${{ secrets.REDKILN_TOKEN }}
          path: .redkiln-cli

      # >= 22.5 is redkiln's floor (it uses `node:sqlite` and
      # `node:util.parseArgs`). 24 rather than 22 so CI runs what this repository
      # is developed on; the committed `dist/` bundle is self-contained, so there
      # is nothing to install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Backlog health
        run: |
          node .redkiln-cli/bin/redkiln.mjs validate
          node .redkiln-cli/bin/redkiln.mjs validate --kb

          # `doctor` exits non-zero on a problem and zero on a warning, so its
          # exit code is captured rather than trusted — the assertions below are
          # the check, and they need the report even when it is red.
          node .redkiln-cli/bin/redkiln.mjs doctor --json > doctor.json || true
          cat doctor.json

          # Three claims, and the third is the one worth explaining.
          #
          # 1. No problems. Same condition as doctor's own exit code, asserted
          #    here so a single failure message names all three claims at once.
          # 2. No process drift. This repository customises TEMPLATES and never
          #    `processes/*.yaml`; a pack edit is either a mistake or a decision
          #    that needs its own review, and neither should arrive silently.
          # 3. Template drift is EXACTLY the set listed below — the templates
          #    customised deliberately. Not "no drift" — that would fail forever,
          #    and a warning nobody can clear teaches its reader the channel is
          #    noise. Not "some drift" either: an EXTRA entry is a template
          #    someone changed without deciding to, and a MISSING entry means a
          #    customisation was reverted, which is what `adopt --templates`
          #    does to a repo that runs it from a feature worktree.
          #
          #    The comment deliberately does not state a COUNT. It said "the four
          #    files" while the list held six, having been written when it held
          #    four — a number in prose beside the list it describes is a second
          #    copy of that list, and it drifts the first time the list moves.
          #
          # Every other warning kind is ignored on purpose. `harvest-unrecorded`
          # and friends fire in normal operation, and a `warnings.length > 0`
          # guard would red this branch the day it landed.
          jq -e '
            (.problems | length) == 0
            and ([.warnings[] | select(.kind == "process-drift")] | length) == 0
            and ([.warnings[] | select(.kind == "template-drift") | .file] | sort) == [
              ".redkiln/templates/_design.md",
              ".redkiln/templates/_intake-brief.md",
              ".redkiln/templates/discover.md",
              ".redkiln/templates/gates/discover.md",
              ".redkiln/templates/gates/intake.md",
              ".redkiln/templates/spec.md"
            ]
          ' doctor.json

  # RETIRED at HS-S0048: the `wasm-conformance` job that used to sit here.
  #
  # It ran `cargo test --locked -p happenstance-testkit --target
  # wasm32-unknown-unknown` on `ubuntu-latest` — every `wasm32`-capable target in
  # that package, named individually nowhere. It is the job that turned ADR-0001
  # from a design argument into precedent, because among those targets is
  # `local_conformance`, whose store is the workspace's only genuinely `!Send`
  # one; before this job, the entire evidence base for the two-flavour port
  # design was a `cargo check`.
  #
  # WHAT MOVED, and where it now runs. All of it, into `cargo xtask ci`'s
  # `wasm32 run of the conformance rules` step, which drives the declared list in
  # `xtask/src/proof.rs`'s `WASM_TARGETS`. That list holds a row per target:
  #
  #   memory_conformance_wasm        — the event-store rules against MemoryFixture
  #   local_conformance              — the same rules against the !Send store
  #   projection_conformance_wasm    — the projection rules, its own enumeration
  #
  # The set is not maintained by hand alone. The mandatory `wasm32 conformance
  # targets are non-vacuous` row scans `crates/happenstance-testkit/tests` and
  # fails if a harness there drives a suite through a `wasm32` emitter and has no
  # row — which is what makes "the gate runs what the job ran" a checked claim.
  # This comment's first draft asserted it while the seam registered one row of
  # the three, and 106 executions had quietly stopped happening anywhere.
  #
  # WHAT THE GATE ADDS beyond the job: it runs on all three `gate` matrix runners
  # rather than on `ubuntu-latest` alone; it runs in the same command a
  # contributor runs locally; and it runs behind an anti-vacuity guard the job
  # never had — `cargo test` exits 0 on `running 0 tests`, so the job would have
  # passed over an emptied harness.
  #
  # WHAT THE GATE DOES NOT ADD, stated because a retirement note that lists only
  # gains is the reason the first one was wrong: the job was mandatory on its
  # runner, and the in-gate execution step is PROBED — it prints `skipped:` where
  # `wasm-bindgen-cli` is absent. That costs nothing in CI, because the `gate`
  # job installs the runner on all three runners (below), and it is why removing
  # that install turns this note into a lie rather than into a warning. On a
  # contributor's machine without the runner, the compensator row still runs and
  # the rules do not; `xtask/src/main.rs`'s comment on the run row argues that
  # trade in full.
  #
  # Keeping both would have left two wasm32 execution paths with no stated
  # division of labour, the weaker one shadowing the stronger. What moved into
  # the `gate` job above rather than being deleted: the `Cargo.lock`-resolved
  # `wasm-bindgen` version and the `wasm-bindgen-cli` install.
  #
  # The sentence this comment replaces said "No Cloudflare and no `workerd`.
  # Those arrive at phase 9." Half of that is now stale and half is still true.
  # The gate executes the testkit's own harnesses against in-process fixtures,
  # which need no platform SDK; a Cloudflare conformance target under a Durable
  # Object runtime is `every-rule-under-workerd` (HS-S0054), and it arrives as a
  # ROW in `xtask/src/proof.rs`'s `WASM_TARGETS` — not as a second job here and
  # not as a second gate step.

  # Verifies the MSRV claimed in Cargo.toml. This is the only place it is
  # checked, so a change that silently requires a newer compiler fails here.
  # The live-Postgres conformance run. A SIBLING of `gate`, never a step inside
  # it, and the distinction is the whole point of this job's existence.
  #
  # `xtask/src/main.rs`'s `REQUIRED` array runs on every `cargo xtask ci`, and
  # `.redkiln/config.yaml` wires `cargo xtask affected` and `cargo xtask ci
  # --fast` as the verify grains for EVERY other project in this initiative. A
  # step in there that needs a container breaks all of them, and breaks the
  # laptop-with-no-Docker case the default gate is promised to keep working. So
  # the container starts here and nowhere else.
  #
  # No credential. Unlike the Neon job, `testcontainers` needs only a daemon, so
  # this runs on pull requests from anywhere. Said out loud because the Neon
  # job's secret handling is a different story's problem, and conflating the two
  # is how a secret ends up gating a container.
  live-postgres:
    name: conformance against a live Postgres
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No `services:` block. The image, its tag and its `max_connections` are
      # the fixture's (`crates/happenstance-postgres/tests/support/mod.rs`), so
      # that a developer running the same command locally gets the same server
      # by construction rather than by remembering to. NF-003 wants the minor
      # pinned where a reader can see it, and a `services:` block would put it
      # somewhere `cargo test` never reads.
      #
      # `ubuntu-latest` runners ship a running Docker daemon, which is what
      # `testcontainers` needs and all it needs.

      # Every rule is present in the binary before any of them runs.
      #
      # This is not a formality: whole-invocation gating means one wrong flag
      # turns the run below into `running 0 tests`, and `cargo test` exits 0 on
      # that. `xtask/src/proof.rs:12-15` is the in-tree statement of the same
      # problem one layer down — "a file truncated to its `#![cfg(...)]`
      # attributes passes". The list is captured so the count assertion after
      # the run can be made against it rather than against a number typed here,
      # which would drift the first time a rule was added.
      - name: Every gated test is present in the binary
        run: |
          cargo test -p happenstance-postgres --all-features             --test postgres_conformance -- --ignored --list | tee gated.txt
          count=$(grep -c ': test$' gated.txt)
          echo "gated tests: $count"
          # 95 event-store rules + 5 concurrency + 1 model + this crate's own 6
          # = 107, measured. CF-18's
          # `every_declined_capability_is_stated_by_this_fixture` is NOT in this
          # total: it is emitted once per mounted suite and is not `#[ignore]`d,
          # so it never appears in an `--ignored` listing. The arithmetic here
          # said 89 and added that test anyway, and was wrong in both directions
          # at once — it reached 102 where the binary lists 107. A run that
          # finds materially fewer has
          # lost an INVOCATION rather than a test, which is how the first draft
          # of this job shipped with two families silently unmounted and a count
          # that looked right.
          #
          # The threshold stays a floor rather than becoming an equality, and
          # deliberately: an equality fails on the commit that *adds* a rule,
          # which trains whoever adds one to edit this number without reading
          # what it is for. The floor only fires when a whole family stops being
          # mounted, which is the defect it was written for.
          if [ "$count" -lt 100 ]; then
            echo "::error::only $count gated tests are present; an invocation is missing"
            exit 1
          fi

      # The run itself.
      #
      # `--test-threads=1` is arithmetic, not a workaround for flakiness.
      #
      # `CONTENDERS` is 64, and a fixture whose pool cannot supply sixty-five
      # handles onto one backing store DEADLOCKS rather than fails (CF-33: there
      # is no watchdog). So each fixture instance sizes its pool at
      # `CONTENDERS + 4` = 68, and the container is started with
      # `max_connections=200` -- which admits two live instances and not a third.
      # libtest defaults to one thread per core, so a parallel run asks for
      # cores x 68 connections and exhausts the server before it exhausts
      # anything else.
      #
      # An earlier draft of this comment blamed the frontier instead, on a
      # measurement of 79 of 95 rules passing in parallel against 93 serially.
      # That measurement is retracted: it was taken on a machine carrying
      # twenty-seven leaked Postgres containers from this fixture's own earlier
      # runs, each of them a live backend able to hold `pg_snapshot_xmin` back --
      # which is exactly the variable it claimed to measure. The connection
      # arithmetic above needs no measurement and does not depend on it.
      #
      # `--show-output` because a declined capability's reason is printed only
      # under it, and a trade nobody can read is a trade nobody recorded (CF-18).
      - name: The conformance suite against a live Postgres
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features             --test postgres_conformance -- --ignored --show-output --test-threads=1             | tee run.txt

      # The vacuity guard, and the reason this job cannot be green having done
      # nothing. The same flag that keeps the default gate green with no server
      # keeps a misconfigured job green with no tests, and the two are
      # indistinguishable in a check mark.
      - name: The run executed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' run.txt; then
            echo "::error::no test result line; the suite did not run at all"
            exit 1
          fi

      # The model family RAN rather than skipped (#79). The fixture declines
      # `READ_YOUR_OWN_WRITES`, which used to make `ops_agree_with_the_model`
      # report a skip; it now runs the testkit's trailing model instead. A skip
      # is a pass to libtest, so the guard above would wave a reverted skip
      # through, and the "1 model" in the count comment above would read the
      # same either way. This step is what tells the two apart.
      - name: The model family ran against the server rather than skipped
        if: always()
        run: |
          if ! grep -qE '^test dcb_model_conformance::ops_agree_with_the_model \.\.\. ok$' run.txt; then
            echo "::error::ops_agree_with_the_model did not pass in run.txt"
            exit 1
          fi
          if grep -q '^SKIP ops_agree_with_the_model' run.txt; then
            echo "::error::ops_agree_with_the_model reported a skip rather than running"
            exit 1
          fi

      # THE PROJECTION SUITE, AND WHY IT IS A SECOND PAIR OF STEPS.
      #
      # The run above filters to `--test postgres_conformance`, which is the
      # event-store target and nothing else. `tests/projection.rs`,
      # `tests/rule_controls.rs` and `tests/naive_arm_probe.rs` are separate
      # targets and that filter excludes all three — so until this section
      # landed, the Postgres PROJECTION suite had never been observed by a
      # second machine, while `rule_controls.rs` carried a header claiming it
      # was "swept up by the live job's existing invocation with no workflow
      # edit". It was not, and a claim inside a shipped `.crate` is the worst
      # place for that to be wrong.
      #
      # Shaped as its own list/run/assert trio rather than by widening the
      # filter above, on the live-Neon job's precedent: one target, one
      # transcript, one count. A combined run would put two `test result:` lines
      # in one file and the assertion reads the last.
      - name: Every gated projection test is present in the binary
        if: ${{ !cancelled() }}
        run: |
          cargo test -p happenstance-postgres --all-features \
            --test projection -- --ignored --list | tee gated-projection.txt

      # `--test-threads=1` for the reason the event-store run gives: the pool
      # arithmetic, not the frontier. `pipefail` because a step's shell is
      # `bash -e` without it, so `cargo test | tee` exits with `tee`'s status:
      # #77's red probe had three rules FAIL here under a green step. Every run
      # step in this job sets it, so every later list and run step carries
      # `!cancelled()`: one red suite must not skip the suites after it.
      - name: The projection suite against a live Postgres
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features \
            --test projection -- --ignored --show-output --test-threads=1 \
            | tee projection-run.txt

      - name: The projection run executed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' projection-run.txt; then
            echo "::error::no test result line; the projection suite did not run at all"
            exit 1
          fi

          expected=$(grep -c ': test$' gated-projection.txt)
          result=$(grep -E '^test result:' projection-run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"

          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored gated projection tests did not execute"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$expected" ]; then
            echo "::error::executed $((passed + failed)) of $expected gated projection tests"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed projection tests failed"
            exit 1
          fi

          expected=$(grep -c ': test$' gated.txt)
          result=$(grep -E '^test result:' run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"

          # `passed > 0` is NOT a sufficient guard, and the first draft of this
          # step used it. Drop `--ignored` from the run above and the target
          # still executes its two no-server tests, so `passed` is 2 and a
          # `> 0` check waves through a run that touched no rule and started no
          # container. What has to be asserted is that NOTHING was left ignored
          # and that the executed count matches what `--list` found.
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored gated tests did not execute; the run is not the gated run"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$expected" ]; then
            echo "::error::executed $((passed + failed)) of $expected gated tests"
            exit 1
          fi

      # THE LIVE PROJECTION STORE, `tests/live_projection.rs` (#77). The far end of
      # PS-2's batch-shape axis -- a live `sqlx` transaction as the batch -- is
      # what ADR-0063 froze the projection port against, and until this trio no
      # second machine had run it: the claim that it clears the suite had no CI
      # record. Its own list/run/assert trio for the projection trio's reason --
      # one target, one transcript, one count -- and asserted the same way:
      # nothing left ignored, and the executed count equals the listed count.
      #
      # `--test-threads=1` because each fixture opens a pool sized for the
      # concurrency family, and the file's own header says why that matters.
      - name: Every gated live-projection test is present in the binary
        if: ${{ !cancelled() }}
        run: |
          cargo test -p happenstance-postgres --all-features \
            --test live_projection -- --ignored --list | tee gated-live-projection.txt

      - name: The live projection store against a live Postgres
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features \
            --test live_projection -- --ignored --show-output --test-threads=1 \
            | tee live-projection-run.txt

      - name: The live-projection run executed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' live-projection-run.txt; then
            echo "::error::no test result line; the live projection suite did not run at all"
            exit 1
          fi

          expected=$(grep -c ': test$' gated-live-projection.txt)
          result=$(grep -E '^test result:' live-projection-run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"

          if [ "$expected" -eq 0 ]; then
            echo "::error::the listing found no gated live-projection tests"
            exit 1
          fi
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored gated live-projection tests did not execute"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$expected" ]; then
            echo "::error::executed $((passed + failed)) of $expected gated live-projection tests"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed live-projection tests failed"
            exit 1
          fi

      # ADR-0022 §9's reproduction, `tests/runtime_seam.rs`: a store built on one
      # runtime and driven from another after the first is gone or idle. Its own
      # list/run/assert trio for the projection trio's reason -- one target, one
      # transcript, one count -- and STRICT, because each case is bounded inside
      # the test (fifteen seconds) and a failure is a finding, not noise.
      #
      # `--test-threads=1` for the pool arithmetic the event-store run gives.
      - name: Every gated runtime-seam test is present in the binary
        if: ${{ !cancelled() }}
        run: |
          cargo test -p happenstance-postgres --all-features \
            --test runtime_seam -- --ignored --list | tee gated-runtime-seam.txt

      - name: The runtime-seam reproduction against a live Postgres
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features \
            --test runtime_seam -- --ignored --show-output --test-threads=1 \
            | tee runtime-seam-run.txt

      - name: The runtime-seam run executed and passed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' runtime-seam-run.txt; then
            echo "::error::no test result line; the runtime-seam reproduction did not run"
            exit 1
          fi

          expected=$(grep -c ': test$' gated-runtime-seam.txt)
          result=$(grep -E '^test result:' runtime-seam-run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; passed $passed, failed $failed, ignored $ignored"

          if [ "$expected" -eq 0 ] || [ "$ignored" -ne 0 ] || [ "$failed" -ne 0 ] \
            || [ "$passed" -ne "$expected" ]; then
            echo "::error::passed $passed of $expected listed, $failed failed, $ignored ignored"
            exit 1
          fi

      # The ingest port's live tests and the ingest family's mount (#108, part
      # D). They are unit tests in the LIBRARY target, not a `--test` target,
      # because the impl is `cfg(test)` and a `cfg(test)` impl is invisible to
      # `tests/`. Every other run in this job filters to a named `--test`
      # target, and the default gate skips `#[ignore]`, so without this trio
      # nothing executes them. Its own list/run/assert, STRICT, for the
      # runtime-seam trio's reasons, and `--test-threads=1` because every rule
      # reads right after it ingests and the frontier needs a quiet server.
      - name: Every gated library test is present in the binary
        if: ${{ !cancelled() }}
        run: |
          cargo test -p happenstance-postgres --all-features \
            --lib -- --ignored --list | tee gated-lib.txt

      - name: The live tests in the library target against a live Postgres
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features \
            --lib -- --ignored --show-output --test-threads=1 \
            | tee lib-run.txt

      - name: The library run executed and passed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' lib-run.txt; then
            echo "::error::no test result line; the library's live tests did not run"
            exit 1
          fi

          expected=$(grep -c ': test$' gated-lib.txt)
          result=$(grep -E '^test result:' lib-run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; passed $passed, failed $failed, ignored $ignored"

          if [ "$expected" -eq 0 ] || [ "$ignored" -ne 0 ] || [ "$failed" -ne 0 ] \
            || [ "$passed" -ne "$expected" ]; then
            echo "::error::passed $passed of $expected listed, $failed failed, $ignored ignored"
            exit 1
          fi

      # The suite must be green, and the failure list is empty on purpose.
      #
      # An earlier draft of this step asserted that two rules
      # (`read_result_is_stable_under_concurrent_append` and
      # `query_items_share_one_snapshot`) MUST fail, on the conclusion that ES-11
      # could not be satisfied by an asynchronous driver at all. That conclusion
      # was wrong. They fail only while the cursor's opening is an inline future
      # that advances when someone polls it; once every operation is handed to
      # the runtime -- which `happenstance-postgres` does because `sqlx` panics
      # without one on the concurrency family's raw contender threads -- the
      # read's task is enqueued at the first poll and runs before an append
      # enqueued after it. All 101 gated tests pass.
      #
      # The step is kept rather than deleted, and kept STRICT: any failure is a
      # failure. A gate that tolerates a named set is one commit away from
      # tolerating the wrong one, and this one already tolerated a set that
      # should never have been there.
      - name: Every gated test passed
        if: always()
        run: |
          failures=$(sed -n '/^failures:$/,/^test result:/p' run.txt \
            | grep -oE '[a-z_0-9:]+::[a-z_0-9]+' | sort -u)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

      # THE NAIVE ARM, UNDER ITS CFG.
      #
      # `tests/rule_controls.rs` and `tests/naive_arm_probe.rs` build the naive
      # `nextval()` store ES-10 rejects, and since `0.4.0` it sits behind the
      # `happenstance_naive_arm` rustc cfg rather than the `naive-arm` Cargo
      # feature. Until then `--all-features` compiled both targets in the gate's
      # clippy and test steps; nothing does now but this step, so without it a
      # refactor of `event_store.rs` could break the control silently.
      #
      # `-D warnings` is repeated because a step's `RUSTFLAGS` REPLACES the
      # job's, and `CARGO_TARGET_DIR` is its own so the store the steps above
      # certify is never compiled with the naive arm in it. Last in the job, so
      # a failure here can never be mistaken for the real adapter's.
      #
      # Clippy first, because the gate's `--all-features` clippy used to reach
      # these items and no longer does. It needs no server.
      - name: Clippy over the naive arm, under its cfg
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -D warnings --cfg happenstance_naive_arm
          CARGO_TARGET_DIR: target/naive-arm
        run: cargo clippy -p happenstance-postgres --all-features --all-targets -- -D warnings

      # `--include-ignored`, not `--ignored`, so the one test that needs no
      # server, `naive_arm_is_reachable_only_under_its_cfg`, runs too, and its
      # `cfg!` assertion proves the flag reached the build. Both files are
      # `#![cfg]`'d whole. A build that lost the cfg (through a job-level
      # `CARGO_ENCODED_RUSTFLAGS`, which outranks `RUSTFLAGS`, or a typo)
      # compiles two empty binaries, and each prints `test result: ok. 0 passed`.
      # So counting `ok` lines is not enough. The check below mirrors the
      # projection trio: the list first, then nothing ignored, and executed
      # equal to listed, and it also requires the named tests.
      - name: The rule controls and the naive-arm probe, under their cfg
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -D warnings --cfg happenstance_naive_arm
          CARGO_TARGET_DIR: target/naive-arm
        run: |
          set -o pipefail
          cargo test -p happenstance-postgres --all-features \
            --test rule_controls --test naive_arm_probe \
            -- --include-ignored --list | tee naive-list.txt
          cargo test -p happenstance-postgres --all-features \
            --test rule_controls --test naive_arm_probe \
            -- --include-ignored --show-output --test-threads=1 | tee naive-run.txt

          expected=$(grep -c ': test$' naive-list.txt)
          results=$(grep -cE '^test result:' naive-run.txt)
          sum() { grep -E '^test result:' naive-run.txt | grep -oE "[0-9]+ $1" \
            | awk '{ s += $1 } END { print s + 0 }'; }
          passed=$(sum passed); failed=$(sum failed); ignored=$(sum ignored)
          echo "targets $results; expected $expected; passed $passed, failed $failed, ignored $ignored"

          if [ "$results" -ne 2 ] || [ "$expected" -eq 0 ]; then
            echo "::error::expected two targets with tests in them under the naive-arm cfg"
            exit 1
          fi
          if [ "$ignored" -ne 0 ] || [ "$failed" -ne 0 ] || [ "$passed" -ne "$expected" ]; then
            echo "::error::passed $passed of $expected listed, $failed failed, $ignored ignored"
            exit 1
          fi
          for name in naive_arm_is_reachable_only_under_its_cfg \
                      cf_13_does_not_yet_reject_the_naive_arm \
                      the_naive_arm_admits_a_position_beneath_one_already_observed; do
            if ! grep -qE "^test ${name} \.\.\. ok$" naive-run.txt; then
              echo "::error::\`${name}\` did not run and pass"
              exit 1
            fi
          done

  # The live-Neon conformance run. `live-postgres`'s sibling, with one structural
  # difference that shapes the whole job: it needs a **credential**, not a daemon.
  #
  # `secrets` is not available in a job-level `if:` — the contexts there are
  # `github`, `needs`, `vars` and `inputs` — so the gate is an env var set at job
  # level and read by every step. On a pull request from a fork, `secrets` is
  # empty, every step below skips, and this job is green having executed nothing.
  # That is stated rather than hidden, because it is exactly the shape CLAUDE.md
  # calls out at the disabled `backlog` job: a check that quietly stops running is
  # worth less than none. The first step prints which of the two happened, so the
  # log says so even when nobody reads the `if:`.
  #
  # The endpoint is a real Neon branch, not a container. Two consequences the
  # Postgres job does not have: the schemas outlive the run, so the fixture sweeps
  # its own leftovers by age on first use, and the round trip is 80-100 ms rather
  # than 0.1 ms, which is why this job is minutes rather than seconds.
  live-neon:
    name: conformance against a live Neon endpoint
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    # Issue #250. Reads carry `xact_id < pg_snapshot_xmin(...)`, and that frontier
    # is held back by any transaction open anywhere on the compute, so two runs
    # against one endpoint fail each other's read-after-append rules. Schemas
    # isolate the data, not the frontier. Two modes, chosen by configuration:
    #
    # * **A branch per run**, when the `NEON_PROJECT_ID` variable and the
    #   `NEON_API_KEY` secret are set: a fresh Neon branch with its own compute,
    #   created below and deleted at the end, so no other run shares its
    #   frontier. It also carries an expiry, so a run killed before its delete
    #   step leaves nothing that outlives the day.
    # * **The shared endpoint** in `NEON_CONNECTION` otherwise, serialised by the
    #   group below. GitHub keeps one running and ONE pending job per group and
    #   cancels an older pending one when a newer one queues, so under load this
    #   mode can report a run cancelled; that is the reason the first mode
    #   exists, and why this mode is the fallback rather than the design. In a
    #   merge queue a cancelled required check ejects the entry, so the queue
    #   should not be switched on until the first mode is configured.
    #
    # Never cancel-in-progress: the delete step must get to run.
    concurrency:
      group: ${{ vars.NEON_PROJECT_ID != '' && format('live-neon-{0}-{1}', github.run_id, github.run_attempt) || 'live-neon-shared' }}
      cancel-in-progress: false
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Said out loud, because "skipped every step" and "ran and passed" are the
      # same green tick otherwise.
      #
      # A fork PR legitimately cannot see the secret, so there the notice is the
      # whole of the honest answer. A **same-repository** run is different: the
      # secret is either configured or it is not, and a green tick over zero
      # executed steps is exactly the failure mode the comment above describes,
      # arriving on the branch the release is cut from. So on a same-repo event
      # an absent secret is an ERROR rather than a notice.
      - name: Whether there is an endpoint to run against
        id: endpoint
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_SHARED_CONNECTION: ${{ secrets.NEON_CONNECTION }}
        run: |
          # The concurrency group above reads the variable alone (a secret is
          # not visible there), so a variable without its key would run
          # unserialised against the shared endpoint: #250 again. Refused.
          # A fork PR sees the variable and not the key, and is told so below.
          if [ -n "$NEON_PROJECT_ID" ] && [ -z "$NEON_API_KEY" ] \
            && [ "${{ github.event.pull_request.head.repo.fork }}" != "true" ]; then
            echo "::error::NEON_PROJECT_ID is set and NEON_API_KEY is not. A branch \
          per run needs both; falling back to the shared endpoint here would run \
          it unserialised. Set the secret, or clear the variable."
            exit 1
          fi
          if [ -n "$NEON_PROJECT_ID" ] && [ -n "$NEON_API_KEY" ]; then
            echo "NEON_PROJECT_ID and NEON_API_KEY are set; this run gets its own branch."
            echo "mode=branch" >> "$GITHUB_OUTPUT"
          elif [ -n "$NEON_SHARED_CONNECTION" ]; then
            echo "NEON_CONNECTION is set; this run uses the shared endpoint, serialised."
            echo "NEON_CONNECTION=$NEON_SHARED_CONNECTION" >> "$GITHUB_ENV"
            echo "mode=shared" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::No Neon credential is visible to a fork PR. Every \
          step below is skipped and this job proves NOTHING about the adapter."
          else
            echo "::error::Neither NEON_PROJECT_ID with NEON_API_KEY nor \
          NEON_CONNECTION is set on a same-repository run, so every step below \
          would be skipped and this job would report green having observed \
          nothing. Configure one, or retire this job and say so - do not leave \
          it reporting success over an empty run."
            exit 1
          fi

      # The branch: a child of the project's default branch, so it inherits the
      # roles, the database and the password `NEON_CONNECTION` carries, with a
      # read-write compute of its own. The connection string is the one Neon
      # returns for it, masked before anything can print it. The step waits for
      # the compute to report itself up, bounded, rather than letting the first
      # rule pay its cold start.
      - name: Create a Neon branch for this run
        id: branch
        if: steps.endpoint.outputs.mode == 'branch'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          name="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          expires=$(date -u -d '+6 hours' +%Y-%m-%dT%H:%M:%SZ)
          body=$(jq -n --arg name "$name" --arg expires "$expires" \
            '{branch: {name: $name, expires_at: $expires}, endpoints: [{type: "read_write"}]}')
          curl -sS --max-time 30 --fail-with-body -X POST "$api/branches" \
            -H "authorization: Bearer $NEON_API_KEY" \
            -H "content-type: application/json" -d "$body" > branch.json \
            || { echo "::error::Neon refused the branch: $(head -c 400 branch.json)"; exit 1; }
          # The id first, so a step that fails from here on still deletes it.
          branch_id=$(jq -r '.branch.id // empty' branch.json)
          test -n "$branch_id" || { echo "::error::Neon answered with no branch id"; exit 1; }
          echo "id=$branch_id" >> "$GITHUB_OUTPUT"
          endpoint_id=$(jq -r '.endpoints[0].id // empty' branch.json)
          # The POOLED host, because that is the path the suite was measured on
          # (`crates/happenstance-neon/tests/support/transport.rs`: "the pooler
          # URL"); `connection_uri` itself names the direct host. Role and
          # password are the parent's, inherited by the branch.
          password=$(jq -r '.connection_uris[0].connection_parameters.password // empty' branch.json)
          test -n "$password" || { echo "::error::Neon returned no connection parameters for $name"; exit 1; }
          echo "::add-mask::$password"
          connection=$(jq -r '.connection_uris[0].connection_parameters
            | "postgresql://\(.role | @uri):\(.password | @uri)@\(.pooler_host)/\(.database | @uri)?sslmode=require"' branch.json)
          rm branch.json
          echo "::add-mask::$connection"
          echo "NEON_CONNECTION=$connection" >> "$GITHUB_ENV"
          echo "branch $name ($branch_id), endpoint $endpoint_id, expires $expires"
          # Up means `active`, or `idle` with nothing pending: a fresh endpoint
          # can read `idle` with `pending_state: active` before it has started.
          state=""
          for attempt in $(seq 1 30); do
            state=$(curl -sS --max-time 10 -H "authorization: Bearer $NEON_API_KEY" \
              "$api/endpoints/$endpoint_id" \
              | jq -r '.endpoint | "\(.current_state)/\(.pending_state // "")"' || true)
            echo "attempt $attempt: $state"
            if [ "$state" = "active/" ] || [ "$state" = "idle/" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::the branch's compute never came up; last state: $state"
          exit 1

      # Every rule is present in the binary before any of them runs.
      #
      # Not a formality: whole-invocation gating means one wrong flag turns the
      # runs below into `running 0 tests`, and `cargo test` exits 0 on that. The
      # lists are captured so the count assertions afterwards are made against
      # them rather than against numbers typed here, which would drift the first
      # time a rule was added.
      - name: Every gated test is present in the binaries
        if: env.NEON_CONNECTION != ''
        run: |
          cargo test -p happenstance-neon --all-features \
            --test neon_conformance -- --ignored --list | tee gated-events.txt
          cargo test -p happenstance-neon --all-features \
            --test neon_projection -- --ignored --list | tee gated-projection.txt
          events=$(grep -c ': test$' gated-events.txt)
          projection=$(grep -c ': test$' gated-projection.txt)
          echo "gated tests: $events event-store, $projection projection"
          # 95 event-store rules + 5 concurrency + 1 model + this crate's own,
          # and 17 projection rules + this crate's own. Deliberately not summed:
          # the previous form said 89 and counted CF-18's
          # `every_declined_capability_is_stated_by_this_fixture` as gated, which
          # it is not — it carries no `#[ignore]`, so it never appears in an
          # `--ignored` listing. Two errors that partly cancelled. The floors
          # below are the operative check and neither depends on the sum. A
          # run that finds materially fewer has lost an INVOCATION rather than a
          # test, which is how a suite ships with a family silently unmounted and
          # a count that looks right.
          #
          # Floors rather than equalities, deliberately: an equality fails on the
          # commit that ADDS a rule, which trains whoever adds one to edit this
          # number without reading what it is for.
          if [ "$events" -lt 100 ]; then
            echo "::error::only $events gated event-store tests are present; an invocation is missing"
            exit 1
          fi
          if [ "$projection" -lt 17 ]; then
            echo "::error::only $projection gated projection tests are present; an invocation is missing"
            exit 1
          fi

      # The runs themselves.
      #
      # `--test-threads=1` is not a workaround for flakiness; it is this adapter's
      # visibility mechanism. Reads carry `xact_id < pg_snapshot_xmin(…)`, and
      # `pg_snapshot_xmin` is held back by the longest open write transaction
      # ANYWHERE on the branch — including the other rules of this same run. In
      # parallel, rules that append and read back see an empty log through no
      # fault of the adapter: 67 of 105 failed that way on the first measured run
      # and 3 of 105 serially. The frontier's cost is stated in the crate root and
      # this is where the suite pays it.
      #
      # `--show-output` because a declined capability's reason is printed only
      # under it, and a trade nobody can read is a trade nobody recorded (CF-18).
      # This adapter reports three, all in the projection family.
      - name: The conformance suites against a live Neon endpoint
        if: env.NEON_CONNECTION != ''
        run: |
          cargo test -p happenstance-neon --all-features --test neon_conformance \
            -- --ignored --show-output --test-threads=1 | tee run-events.txt
          cargo test -p happenstance-neon --all-features --test neon_projection \
            -- --ignored --show-output --test-threads=1 | tee run-projection.txt

      # The vacuity guard, and the reason this job cannot be green having done
      # nothing. The same flag that keeps the default gate green with no endpoint
      # keeps a misconfigured job green with no tests, and the two are
      # indistinguishable in a check mark.
      - name: The runs executed every gated test
        if: always() && env.NEON_CONNECTION != ''
        run: |
          for pair in "run-events.txt:gated-events.txt" "run-projection.txt:gated-projection.txt"; do
            run="${pair%%:*}"; gated="${pair##*:}"
            if ! grep -qE '^test result:' "$run"; then
              echo "::error::no test result line in $run; that suite did not run at all"
              exit 1
            fi
            expected=$(grep -c ': test$' "$gated")
            result=$(grep -E '^test result:' "$run" | tail -1)
            passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
            failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
            ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
            echo "$run: expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"
            # `passed > 0` is NOT a sufficient guard. Drop `--ignored` from the
            # run above and the target still executes its no-endpoint tests, so
            # `passed` is non-zero and a `> 0` check waves through a run that
            # touched no rule. What has to be asserted is that NOTHING was left
            # ignored and that the executed count matches what `--list` found.
            if [ "$ignored" -ne 0 ]; then
              echo "::error::$ignored gated tests did not execute in $run; the run is not the gated run"
              exit 1
            fi
            if [ "$((passed + failed))" -ne "$expected" ]; then
              echo "::error::$run executed $((passed + failed)) of $expected gated tests"
              exit 1
            fi
          done

      # The model family RAN rather than skipped (#79). The fixture declines
      # `READ_YOUR_OWN_WRITES`, which used to make `ops_agree_with_the_model`
      # report a skip; it now runs the testkit's trailing model instead. A skip
      # is a pass to libtest, so the steps above would wave a reverted skip
      # through, and the "1 model" in the count comment above would read the
      # same either way. This step is what tells the two apart.
      - name: The model family ran against the endpoint rather than skipped
        if: always() && env.NEON_CONNECTION != ''
        run: |
          if ! grep -qE '^test dcb_model_conformance::ops_agree_with_the_model \.\.\. ok$' run-events.txt; then
            echo "::error::ops_agree_with_the_model did not pass in run-events.txt"
            exit 1
          fi
          if grep -q '^SKIP ops_agree_with_the_model' run-events.txt; then
            echo "::error::ops_agree_with_the_model reported a skip rather than running"
            exit 1
          fi

      # The ingest port's live tests and the ingest family's mount (#108, part
      # C). They are unit tests in the LIBRARY target, not a `--test` target,
      # because the impl is `cfg(test)` and a `cfg(test)` impl is invisible to
      # `tests/`. Both runs above filter to a named `--test` target, and the
      # default gate skips `#[ignore]`, so without this trio nothing executes
      # them. Its own list/run/assert, STRICT, as `live-postgres`'s library trio
      # is, and `--test-threads=1` for the frontier's reason above: every rule
      # reads right after it ingests.
      - name: Every gated library test is present in the binary
        if: ${{ !cancelled() && env.NEON_CONNECTION != '' }}
        run: |
          cargo test -p happenstance-neon --all-features \
            --lib -- --ignored --list | tee gated-lib.txt

      - name: The live tests in the library target against a live Neon endpoint
        if: ${{ !cancelled() && env.NEON_CONNECTION != '' }}
        run: |
          set -o pipefail
          cargo test -p happenstance-neon --all-features \
            --lib -- --ignored --show-output --test-threads=1 \
            | tee lib-run.txt

      - name: The library run executed and passed every gated test
        if: always() && env.NEON_CONNECTION != ''
        run: |
          if ! grep -qE '^test result:' lib-run.txt; then
            echo "::error::no test result line; the library's live tests did not run"
            exit 1
          fi

          expected=$(grep -c ': test$' gated-lib.txt)
          result=$(grep -E '^test result:' lib-run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; passed $passed, failed $failed, ignored $ignored"

          if [ "$expected" -eq 0 ] || [ "$ignored" -ne 0 ] || [ "$failed" -ne 0 ] \
            || [ "$passed" -ne "$expected" ]; then
            echo "::error::passed $passed of $expected listed, $failed failed, $ignored ignored"
            exit 1
          fi

      # The suites must be green, and the failure list is empty on purpose.
      #
      # KEPT STRICT, and there is one rule that makes that a real cost.
      # `read_result_is_stable_under_concurrent_append` is a **network race** for
      # this adapter and cannot be made otherwise: a read and an append are two
      # independent requests to a proxy, so nothing orders one backend's snapshot
      # against another's commit. Measured over the conformance transport, twenty
      # runs per configuration: 3 red in 20 over HTTP/1.1, and 1 red in 40 over a
      # single HTTP/2 connection, which is why the transport is HTTP/2 with a
      # one-connection pool.
      #
      # So this job will occasionally be red for a reason that is not a
      # regression, and that is deliberate rather than overlooked. Tolerating a
      # NAMED set of failures is the alternative and it is worse: `live-postgres`
      # records that a gate which tolerates a named set is one commit away from
      # tolerating the wrong one, and it already tolerated a set that should never
      # have been there. The residual belongs to ES-11's owner as a clause
      # question — one-shot HTTP is a shape its sufficiency condition for
      # asynchronous drivers does not cover — and hiding it behind an allowlist
      # here would be this job answering it.
      - name: Every gated test passed
        if: always() && env.NEON_CONNECTION != ''
        run: |
          failures=$(cat run-events.txt run-projection.txt \
            | sed -n '/^failures:$/,/^test result:/p' \
            | grep -oE '[a-z_0-9:]+::[a-z_0-9]+' | sort -u)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

      # Nothing outlives the run. Its own step, on `always()`, so a red suite
      # still deletes; the expiry set at creation covers a run killed first.
      - name: Delete the Neon branch for this run
        if: always() && steps.branch.outputs.id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # Retried, because Neon answers 423 while an operation on the branch is
          # still running. A delete that never lands is a warning and not a red
          # run: the branch's expiry removes it, and the suite's verdict stands.
          for attempt in 1 2 3 4 5; do
            if curl -sS --max-time 30 --fail-with-body -X DELETE \
              -H "authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/${{ steps.branch.outputs.id }}" \
              > delete.txt; then
              echo "deleted"; exit 0
            fi
            echo "attempt $attempt: $(head -c 200 delete.txt)"
            sleep $((attempt * 5))
          done
          echo "::warning::the Neon branch was not deleted; its expiry will remove it"

  # Every event-store conformance rule inside `workerd`, through a real Durable
  # Object — `happenstance-cloudflare`'s 1.0 claim is *conformance on the real
  # runtime* (ADR-0066 §6), and the gate runs the rules against a `node:sqlite`
  # shim. A sibling of `gate`, never a step inside it: it needs Node, an npm
  # lockfile and, for its second leg, a Cloudflare account, and none of those
  # belongs in `cargo xtask ci`
  # (`.kb/open-questions/no-workerd-class-runner-in-the-gate.md`).
  #
  # Two legs over one Worker (`harness/workerd`):
  #
  # * **local** — `@cloudflare/vitest-pool-workers`, which runs `workerd`
  #   itself, pinned by `harness/workerd/package-lock.json`. No secret; runs on
  #   every PR, forks included.
  # * **deployed** — the same Worker deployed to the account behind
  #   `CLOUDFLARE_API_TOKEN`, driven over HTTPS. The only place the platform's
  #   own limits can be observed rather than inferred: the row wall differs
  #   between `workerd` releases, so no local runner settles it.
  #
  # The local leg also runs the rules across a restart of the object (#262):
  # five phased rules, evicted from the runner for the adapter and for three
  # wrong stores, with a no-restart control, and hibernated through workerd's
  # own inactivity timer for the adapter; then the whole family on a
  # cold-started object; then idle objects holding the adapter, with and
  # without a partly read stream, evicted by that same timer, beside a timer
  # control that is not. The deployed leg repeats the hibernation cells and
  # the idle cells, record-only (`deployed-restart.mjs`).
  #
  # Both legs also run `happenstance-sync`'s ingest family (#108 part E3)
  # against `CloudflareIngestStore`, built by the published
  # `namespaced_from_object_state` over the object's real state, so each call
  # is one real `transactionSync`: strictly, warm and cold-started, on local
  # workerd, and strictly on the deployed object (`deployed.mjs`). Beside it, a
  # census of F's D7 failure classes and a bisection of the largest ingest call
  # the runtime commits: strict locally where the result is the adapter's own
  # declaration, record-only on the deployed object (`deployed-ingest.mjs`).
  #
  # Both legs end with the wall probe's report in the log
  # (`experiments/durable-object-limits`). Not a required status check.
  workerd:
    name: conformance under workerd, local and deployed
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    # One Worker per run, named for the run (`WORKER_NAME`), so no group is
    # needed. Until #250 every run deployed and deleted the same name, under a
    # `workerd-deployed` group that serialised them; back to back was still too
    # close, because a delete that is still reaching the edge can land on the
    # next run's fresh deploy (`500 Worker not found.` after a 200 on the probe).
    # A name nobody else deploys has no predecessor to race. Workers.dev
    # hostnames are per name, so each run's URL is its own too.
    env:
      WORKER_NAME: happenstance-workerd-harness-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: harness/workerd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rust-toolchain.toml pins the channel and the wasm32 target.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/workerd/package-lock.json

      # Pinned to the `worker` crate's own version; `worker-build` downloads the
      # `wasm-bindgen` that matches Cargo.lock by itself.
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Install the pinned runner
        run: npm ci

      - name: Build the harness Worker
        run: worker-build --release

      - name: The conformance rules under local workerd
        run: |
          npx vitest run test/conformance.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-run.json

      # The vacuity guard. The rule names come from the harness, which expands
      # the testkit's enumeration, so the test count is the suite's own rather
      # than a number typed here; a rule the dispatcher does not know answers 404
      # and fails by name. What this adds is that nothing was skipped, that every
      # collected test executed, and a floor under the count. A floor rather than
      # an equality, for live-neon's reason: an equality fails on the commit that
      # adds a rule. (Listing first, as live-neon does, is not available: `vitest
      # list` cannot reach a Durable Object binding.)
      - name: The run executed every rule
        if: always()
        run: |
          test -f vitest-run.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq '.numTotalTests' vitest-run.json)
          passed=$(jq '.numPassedTests' vitest-run.json)
          failed=$(jq '.numFailedTests' vitest-run.json)
          pending=$(jq '.numPendingTests + .numTodoTests' vitest-run.json)
          echo "collected $total; executed $((passed + failed)) (passed $passed, failed $failed), not run $pending"
          # 95 rules + CF-18's declension check + the enumeration check.
          if [ "$total" -lt 97 ]; then
            echo "::error::only $total tests were collected; the enumeration or the dispatcher has lost rules"
            exit 1
          fi
          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending tests did not run"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$total" ]; then
            echo "::error::executed $((passed + failed)) of $total"
            exit 1
          fi

      # Strict, with the failure list empty on purpose: no tolerated set.
      - name: Every rule passed under local workerd
        if: always()
        run: |
          failures=$(jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .title' vitest-run.json)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures under workerd:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

      # The transactionSync probe (#108, part F; worker.mjs's
      # `/transaction-probe/<case>`). The ingest store behind `cfg(test)` runs
      # each call in one `ctx.storage.transactionSync`, and the gate checks it
      # against a node:sqlite model of that primitive; these cells measure what
      # the model assumes on this runtime: a throw rolls back rows and the
      # AUTOINCREMENT counter and is rethrown, a return commits, UPDATE OR
      # IGNORE ... RETURNING answers no row on a conflict, and exec refuses
      # SAVEPOINT and BEGIN. Strict, with the same vacuity guard as the rest.
      - name: The transactionSync properties under local workerd
        if: always()
        run: |
          npx vitest run test/transaction.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-transaction.json
          test -f vitest-transaction.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-transaction.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-transaction.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-transaction.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "transaction cells: collected $total, passed $passed, not run $pending"
          # the function, throw, return, UPDATE OR IGNORE, exec refusal, unknown case.
          if [ "$total" -lt 6 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the transaction run did not execute and pass every cell"
            exit 1
          fi

      # The ingest family (#108 part E3; harness/workerd/src/ingest/): every
      # rule of `for_each_ingest_store_rule!` plus CF-18's ingest declension
      # check, each on its own object, against `CloudflareIngestStore` built by
      # the published `namespaced_from_object_state` over the object's real
      # state, so the mid-group fault fires inside the real `transactionSync`.
      # The names come from `/ingest-rules`, the testkit's own enumeration.
      # Strict: every rule must answer `ran` (no skip is expected and none is
      # tolerated), with the transaction step's vacuity guard; a floor rather
      # than an equality, for live-neon's reason.
      - name: The ingest family under local workerd
        if: always()
        run: |
          npx vitest run test/ingest.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-ingest.json
          test -f vitest-ingest.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-ingest.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-ingest.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-ingest.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "ingest: collected $total, passed $passed, not run $pending"
          # 6 rules + the declension check + the enumeration check + the unknown rule.
          if [ "$total" -lt 9 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the ingest run did not execute and pass every cell"
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .fullName' vitest-ingest.json
            exit 1
          fi

      # The same family on an object that was primed (every log a rule may open
      # migrated, each identity minted) and then evicted, so `store_id` is read
      # from a `store_meta` row a previous instance wrote and the fault trigger
      # is armed over existing tables. Each rule must run in a new instance.
      - name: The ingest family on a cold-started object under local workerd
        if: always()
        run: |
          npx vitest run test/ingest-cold.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-ingest-cold.json
          test -f vitest-ingest-cold.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-ingest-cold.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-ingest-cold.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-ingest-cold.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "cold ingest: collected $total, passed $passed, not run $pending"
          # 6 rules + the declension check + the enumeration check.
          if [ "$total" -lt 8 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the cold ingest run did not execute and pass every cell"
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .fullName' vitest-ingest-cold.json
            exit 1
          fi

      # F's D7 classes, revisited (harness/workerd/src/ingest/classes.rs): each
      # reachable ingest failure provoked through the production store, the
      # identical call retried on the same object, and the class judged by the
      # retry. Strict: `trigger-abort` and `missing-schema` must hold;
      # `storage-full` must hold or be unreachable (the object's authoriser
      # decides whether its PRAGMA runs), never falsify a class or miss a
      # marker. A red here is recorded and the adapter is changed, if at all, in
      # a change of its own (D-E3-1).
      - name: The ingest failure classes under local workerd
        if: always()
        run: |
          npx vitest run test/ingest-classes.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-ingest-classes.json
          test -f vitest-ingest-classes.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-ingest-classes.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-ingest-classes.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-ingest-classes.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "ingest class: collected $total, passed $passed, not run $pending"
          # three cases + the unknown case.
          if [ "$total" -lt 4 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the ingest class run did not execute and pass every cell"
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .fullName' vitest-ingest-classes.json
            exit 1
          fi

      # What the ingest ceiling's bisection decides (ingest-ceiling.mjs), pinned
      # without a runtime, and that a 422 is never a platform miss: as "What the
      # deployed leg retries" pins platform-miss.mjs.
      - name: What the bisection of the ingest ceiling decides
        if: always()
        run: npx vitest run test/ingest-ceiling-bisect.test.ts --reporter=verbose

      # The largest single ingest call local workerd commits, per event shape,
      # bisected by the runner one object per attempt. Strict on the `minimal`
      # axis only: the runtime must commit the adapter's declared 1,024 events,
      # and the attempt at 1,025 must be the adapter's own refusal
      # (`class=Split`). The other two axes are printed for
      # experiments/durable-object-limits/results/.
      - name: The ingest ceiling of local workerd
        if: always()
        run: npx vitest run test/ingest-ceiling.test.ts --reporter=verbose

      # The cross-restart rules (harness/workerd/src/restart.rs, #262): each
      # rule writes, the object restarts, and the rule asserts. Evicted from the
      # runner for the adapter and for three wrong stores, which must fail exactly
      # the registry's (rule, check) pairs; the same cells with no restart,
      # where every store passes; one after-half told to expect a restart that
      # did not happen (409); and the adapter across a hibernation through
      # workerd's own 10 s inactivity timer, woken on a held WebSocket. The
      # log is kept for the mutant count the next step reads.
      - name: The rules across a restart under local workerd
        if: always()
        run: |
          set -o pipefail
          npx vitest run test/restart.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-restart.json \
            | tee vitest-restart.log

      # The vacuity guard for the run above, in the shape of the one for the
      # rules. The cell floor is today's count (1 listing check + 20 evicted +
      # 20 control + 1 guard + 5 hibernated: 5 rules, 4 subjects), a floor for
      # live-neon's reason. The mutant line must read N of M with N = M: every
      # rejection the registry lists was observed. And M must be at least
      # today's registry total (instance-log 5 + fresh-high-water 2 +
      # mints-per-open 1), so a registry that quietly loses rows fails here.
      - name: The restart run executed every cell and saw every wrong store fail
        if: always()
        run: |
          test -f vitest-restart.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq '.numTotalTests' vitest-restart.json)
          passed=$(jq '.numPassedTests' vitest-restart.json)
          failed=$(jq '.numFailedTests' vitest-restart.json)
          pending=$(jq '.numPendingTests + .numTodoTests' vitest-restart.json)
          echo "collected $total; executed $((passed + failed)) (passed $passed, failed $failed), not run $pending"
          if [ "$total" -lt 47 ]; then
            echo "::error::only $total restart cells were collected; the registry or the runner has lost some"
            exit 1
          fi
          if [ "$pending" -ne 0 ] || [ "$((passed + failed))" -ne "$total" ]; then
            echo "::error::$pending restart cells did not run; executed $((passed + failed)) of $total"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::restart cells failed:"
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .fullName' vitest-restart.json
            exit 1
          fi
          line=$(grep -oE 'mutant rejections observed: [0-9]+ of [0-9]+' vitest-restart.log || true)
          echo "${line:-no mutant line}"
          if ! [[ "$line" =~ ^mutant\ rejections\ observed:\ ([0-9]+)\ of\ ([0-9]+)$ ]] \
            || [ "${BASH_REMATCH[1]}" -ne "${BASH_REMATCH[2]}" ] || [ "${BASH_REMATCH[2]}" -lt 8 ]; then
            echo "::error::the wrong stores were not all seen to fail, or the registry lists fewer than 8 rejections"
            exit 1
          fi

      # The whole family again, each rule on an object that was primed (every
      # log it may open migrated, each identity minted) and then evicted, so the
      # rule opens state a previous instance created. Weaker than the rules
      # above, since each rule still runs inside one instance; the rule's
      # response names its instance, and the runner requires it to be new.
      - name: The conformance rules on a cold-started object under local workerd
        if: always()
        run: |
          npx vitest run test/conformance-cold.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-cold.json

      # The same guard and the same floor as the warm run's.
      - name: The cold-start run executed and passed every rule
        if: always()
        run: |
          test -f vitest-cold.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq '.numTotalTests' vitest-cold.json)
          passed=$(jq '.numPassedTests' vitest-cold.json)
          failed=$(jq '.numFailedTests' vitest-cold.json)
          pending=$(jq '.numPendingTests + .numTodoTests' vitest-cold.json)
          echo "collected $total; executed $((passed + failed)) (passed $passed, failed $failed), not run $pending"
          if [ "$total" -lt 97 ]; then
            echo "::error::only $total tests were collected; the enumeration or the dispatcher has lost rules"
            exit 1
          fi
          if [ "$pending" -ne 0 ] || [ "$((passed + failed))" -ne "$total" ]; then
            echo "::error::$pending tests did not run; executed $((passed + failed)) of $total"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::conformance failures on a cold-started object:"
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .title' vitest-cold.json
            exit 1
          fi
          echo "no conformance failures on a cold-started object"

      # An idle object holding the adapter, alone and with a read stream opened
      # and advanced by one event (harness/workerd/src/idle.rs, #262 item 2):
      # evicted by workerd's 10 s inactivity timer at 12 s, not yet at 8 s, and
      # the stream held through the 8 s wait yields every event it had left.
      # The positive control, the same hold plus a pending JavaScript interval,
      # is NOT evicted at 12 s, so the run can tell an object with something
      # pending from one holding only memory. Strict: each cell's own
      # instance witness decides it. The waits are the platform's timer, and
      # the check after the run requires every cell to have passed.
      - name: Idle stores are evicted by the workerd inactivity timer
        if: always()
        run: |
          npx vitest run test/idle.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-idle.json
          test -f vitest-idle.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-idle.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-idle.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-idle.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "idle cells: collected $total, passed $passed, not run $pending"
          # plain and held-stream at 12 s and at 8 s, and the timer control.
          if [ "$total" -lt 5 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the idle run did not execute and pass every cell"
            exit 1
          fi

      # The re-mint leg's local half (#298, harness/workerd/src/remint.rs).
      # The leg itself restores a SQLite bookmark, and the pinned workerd does
      # not implement a restore, so it runs on the deployed object below. Here:
      # the pin that this workerd refuses the restore (it fails on the bump
      # that lifts it, which is when the leg moves here), and the two refusals
      # an after-half owes the deployed run, across no restart and across an
      # eviction that rolled nothing back. Strict.
      - name: The re-mint refusals, and the restore local workerd lacks
        if: always()
        run: |
          npx vitest run test/remint.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=vitest-remint.json
          test -f vitest-remint.json || { echo "::error::no report; the run did not happen"; exit 1; }
          total=$(jq -e '.numTotalTests | numbers' vitest-remint.json) || { echo "::error::the report has no test count"; exit 1; }
          passed=$(jq -e '.numPassedTests | numbers' vitest-remint.json) || { echo "::error::the report has no pass count"; exit 1; }
          pending=$(jq -e '.numPendingTests + .numTodoTests | numbers' vitest-remint.json) || { echo "::error::the report has no skip count"; exit 1; }
          echo "re-mint cells: collected $total, passed $passed, not run $pending"
          # the missing restore, no restart, no restore for each mode, a bad mode.
          if [ "$total" -lt 5 ] || [ "$pending" -ne 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::the re-mint run did not execute and pass every cell"
            exit 1
          fi

      - name: The SQLite walls of local workerd
        if: always()
        run: npx vitest run test/limits.test.ts --reporter=verbose

      # What the deployed leg below retries (platform-miss.mjs): Cloudflare's
      # propagation answers and nothing else. Pinned here, where a change to the
      # matcher or the attempt count fails by name rather than as a flaky deploy.
      - name: What the deployed leg retries
        if: always()
        run: npx vitest run test/platform-miss.test.ts --reporter=verbose

      # The deployed leg. The same rule for the secret as live-neon: a fork PR
      # cannot see it and is told so; a same-repository run without it is an
      # error, because a green tick over a skipped leg proves nothing.
      #
      # The credentials are step-scoped, on the three steps that need them, so
      # nothing before them — `npm ci`'s install scripts, `cargo install`'s build
      # scripts, the local runs — can read them.
      - name: Whether there is an account to deploy to
        id: account
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are set; the deployed leg will run."
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::Cloudflare credentials are not visible to a fork PR. \
          The deployed leg is skipped and proves NOTHING about the platform."
          else
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not \
          set on a same-repository run, so the deployed leg would be skipped and \
          report green having observed nothing."
            exit 1
          fi

      - name: Deploy the harness Worker
        id: deploy
        if: always() && steps.account.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A fresh token per run, masked before anything can print it, and
          # deployed in the same upload as the code. The first run set it with
          # `wrangler secret put` after the deploy: the upload reported success
          # and the Worker still answered "not configured" for the whole
          # readiness window. One atomic deploy has no such window. It is a
          # plain var rather than a secret, which is acceptable for a value
          # minted per run on a Worker deleted at the end of the same run.
          # Sweep first. A name per run means a run killed before its delete
          # step leaves a Worker no later deploy overwrites, so any harness
          # Worker untouched for three hours goes here (the job times out at
          # thirty minutes, so none of them is a live run's). Best effort: a
          # sweep that cannot list or delete warns and the run goes on.
          cutoff=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%S)
          scripts="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          if listing=$(curl -sS --max-time 30 --fail -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" "$scripts") \
            && stale=$(jq -r --arg cutoff "$cutoff" '.result[]
                | select(.id | test("^happenstance-workerd-harness(-[0-9]+-[0-9]+)?$"))
                | select(.modified_on[0:19] < $cutoff) | .id' <<<"$listing"); then
            for old in $stale; do
              echo "sweeping $old"
              curl -sS --max-time 30 --fail -X DELETE -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$scripts/$old?force=true" > /dev/null || echo "::warning::could not sweep $old"
            done
          else
            echo "::warning::could not list the account's Workers; nothing swept"
          fi

          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "HARNESS_TOKEN=$token" >> "$GITHUB_ENV"
          npx wrangler deploy --name "$WORKER_NAME" --var "HARNESS_TOKEN:$token" | tee deploy.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          test -n "$url" || { echo "::error::wrangler printed no workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # `deployed.mjs` runs both families, the event-store rules and the
      # ingest rules (#108 part E3), each listed by the harness and each
      # strict: every listed rule executed, none failed. An ingest rule's
      # violation answers 422, a failure and never a platform miss.
      - name: The conformance rules on a deployed Durable Object
        if: always() && steps.deploy.outputs.url != ''
        run: |
          # A new deployment takes a moment to reach the edge. The wait is
          # bounded, and running out of it fails with what the Worker last
          # answered rather than falling through to the run. Three 200s in a
          # row rather than one: a single answer comes from a single edge node,
          # and the run that follows is spread across several.
          ready=""
          streak=0
          for attempt in $(seq 1 20); do
            status=$(curl -s --max-time 10 --connect-timeout 5 -o last.txt -w '%{http_code}' \
              -H "authorization: Bearer $HARNESS_TOKEN" \
              "${{ steps.deploy.outputs.url }}/do/ready-${{ github.run_id }}/rules")
            echo "attempt $attempt: $status"
            if [ "$status" = "200" ]; then streak=$((streak + 1)); else streak=0; fi
            if [ "$streak" -ge 3 ]; then ready=yes; break; fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::the deployed Worker never answered 200; last: $status $(head -c 200 last.txt)"
            exit 1
          fi
          node deployed.mjs "${{ steps.deploy.outputs.url }}" \
            "run-${{ github.run_id }}-${{ github.run_attempt }}"

      # The hibernation cells again, over `wss://` on the deployed object, waiting
      # for Cloudflare's own inactivity timer. RECORD-ONLY: the script prints
      # whether each object restarted, after how long, and the after-half's
      # verdict, and exits 0 whatever it saw. Local workerd produces a real
      # hibernation and runs the same cells strictly above; the platform's
      # timing is pinned by nothing here, and a timing red does not belong in
      # the merge queue. The same run prints the idle cells' table (evicted at
      # 12 s or 8 s, and the witnesses), record-only for a sharper reason:
      # nothing pinned states when production evicts an object with no
      # hibernatable socket, so "not evicted" there would be the platform's
      # policy, not the adapter's doing. Covered by the delete step's `if:`.
      - name: Restart and idle on a deployed Durable Object (record-only)
        if: always() && steps.deploy.outputs.url != ''
        run: |
          node deployed-restart.mjs "${{ steps.deploy.outputs.url }}" \
            "restart-${{ github.run_id }}-${{ github.run_attempt }}"

      # `remint_identity` across a real bookmark restore (#298): on a deployed
      # object, take a bookmark, write past it, restore it (the object
      # restarts), then re-mint and write again; the re-mint cell must reissue
      # no `EventId`, and the control that skips the re-mint must reissue one.
      # Deployed only, because local workerd does not implement a restore (the
      # local step above pins that). Asserted when the restore runs, recorded
      # when it cannot: a cell that observed the restore and failed the judge
      # (422) fails the step, while a cell that could not run, or whose restore
      # or restart never landed, only warns, for deployed-restart.mjs's reason
      # (nothing pinned here documents how a restore lands on Cloudflare).
      # Covered by the delete step's `if:`.
      - name: Re-mint across a bookmark restore on a deployed Durable Object
        if: always() && steps.deploy.outputs.url != ''
        run: |
          node deployed-remint.mjs "${{ steps.deploy.outputs.url }}" \
            "remint-${{ github.run_id }}-${{ github.run_attempt }}"

      # The ingest ceiling and the D7 census again, on the deployed object
      # (#108 part E3). RECORD-ONLY: the platform's memory and CPU walls are
      # pinned by nothing here, which is the hibernation cells' reason. The
      # script prints both, for experiments/durable-object-limits/results/, and
      # fails only if a route answers `no route`, which means the deployed
      # Worker is not this commit's. Covered by the delete step's `if:`.
      - name: The ingest ceiling and failure classes on a deployed Durable Object (record-only)
        if: always() && steps.deploy.outputs.url != ''
        run: |
          node deployed-ingest.mjs "${{ steps.deploy.outputs.url }}" \
            "ingest-${{ github.run_id }}-${{ github.run_attempt }}"

      # Nothing is left listening: the Worker and every object's storage go.
      # Keyed on the deploy having *run* rather than on its URL: with a name per
      # run, a deploy that uploaded and then failed to print a URL would
      # otherwise leave a Worker no later run overwrites.
      - name: Delete the harness Worker
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --name "$WORKER_NAME" --force

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `master` rather than `stable` because this job names its own toolchain
      # below, and on that branch `action.yml` marks the input required rather
      # than defaulting it — which is the branch to be on when the number is the
      # point. It was `@master` unpinned until this commit: a BRANCH, so every
      # run of this job took whatever had been pushed to it, on a repository
      # nobody here controls.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # the `master` branch, 2026-09-03
        with:
          # 1.97.1 as of ADR-0029, raised from 1.85. Kept spelled out here rather
          # than deferring to `rust-toolchain.toml` so that this job fails loudly
          # if the two ever disagree — the pin and the promise are different
          # facts that currently happen to be the same number.
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--no-dev-deps` because dev-dependencies are free to require a newer
      # compiler than the published crates do. This is what a *consumer* sees.
      - name: Install cargo-hack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --no-dev-deps --rust-version

      # And this is what a *contributor* sees, which the step above cannot tell
      # us: `--no-dev-deps` is precisely the flag that hides `proptest` and
      # `tokio`.
      #
      # Read honestly, this job proves less than it did at 1.85, and the reason
      # should not be discovered later: the MSRV now EQUALS the pinned toolchain,
      # so both steps run the same compiler the gate already runs and there is no
      # headroom left to check. It is kept because the numbers are independent
      # facts that will diverge again — `rust-toolchain.toml` moves whenever a
      # contributor wants a newer compiler, and this one moves only by ADR. The
      # day they differ, this job starts proving something again.
      - name: Tests at the MSRV, dev-dependencies included
        run: cargo test --workspace --all-features

  # Public API changes must be intentional. This fails a PR that breaks semver
  # without a version bump. The event guard is load-bearing: it is what makes
  # `pull_request.base.sha` or `merge_group.base_sha` below non-empty.
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    needs: changes
    # A pull request and its queue entry; there is no base to compare a push
    # against. Fails open on `changes` for the reason that job gives.
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      # The baseline below names a commit, so that commit has to exist locally.
      # `actions/checkout` defaults to `fetch-depth: 1`, which fetches only the
      # pull request's merge ref — the base commit is not in that clone, and
      # cargo-semver-checks cannot resolve a rev it does not have. `0` takes the
      # full history, which is the only depth that is right regardless of how far
      # the branch has diverged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Whether the version the workspace declares is already on crates.io.
      # Inside a breaking window the base commit and this pull request both read
      # the next, unreleased version, so the step below compares two states no
      # consumer can install and every break it reports is "against nothing" --
      # the reason postgres and neon were once kept out of its package list. Until
      # that version is published the step is advisory: its findings still show on
      # the pull request that introduced them, which is what the release's trace
      # table is built from, but they do not block. Once the version is on
      # crates.io this probe answers `true` and the step blocks again, with no
      # edit here. A probe that cannot reach crates.io answers `true`, so an
      # outage never quietly relaxes the check.
      - name: is the declared version published
        id: published
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "happenstance-ci (https://github.com/Wet-Ink-Corporation/happenstance)" \
            "https://crates.io/api/v1/crates/happenstance-core/$version" || echo 000)
          if [ "$status" = "404" ]; then
            echo "happenstance-core $version is not on crates.io; the base-commit check is advisory"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "happenstance-core $version: crates.io answered $status; the base-commit check blocks"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: semver against the base commit
        continue-on-error: ${{ steps.published.outputs.published == 'false' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          # Compare against the commit this pull request branched from. This
          # catches a break introduced *by this pull request*. It cannot see a
          # break merged two pull requests ago, because that break is already
          # part of its baseline. The registry baseline below covers that case.
          #
          # Until `0.2.0` this was the only baseline. Every name sat at `0.0.0`,
          # and Cargo treats each `0.0.x` as incompatible with every other, so
          # the registry had no compatible predecessor to diff against.
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # All nine published crates, the facade included. `happenstance`
          # re-exports the contract wholesale today, so its surface duplicates
          # happenstance-core's. It is still the crate `cargo add happenstance`
          # installs, and it stops being a duplicate the moment the typed layer
          # grows an API of its own.
          #
          # `happenstance-postgres` and `happenstance-neon` were left out of this
          # line until phase 15. Before `0.2.0` they had no published version, so
          # diffing against the base commit compared two states no consumer could
          # install, and every difference was a "break" against nothing. The
          # first run proved it: `inherent_method_const_removed` fired for
          # `NeonProjectionStore::new`, which stopped being `const` when the
          # store gained a per-instance stamp. The finding was true, and it was
          # about a crate with no consumers. Both crates have been on crates.io
          # since `0.2.0`, so that reason has expired.
          #
          # `happenstance-sync` and `happenstance-sync-testkit` since #108 part
          # E published them. On the pull request that did, the base commit
          # holds them as `publish = false`; from the next one on, this compares
          # two states of a published crate like every other name here.
          package: happenstance, happenstance-core, happenstance-testkit, happenstance-sqlite, happenstance-cloudflare, happenstance-postgres, happenstance-neon, happenstance-sync, happenstance-sync-testkit

      # THE REGISTRY BASELINE. It diffs against the newest compatible published
      # version, which is what a consumer can actually install. It does not say
      # which pull request introduced a break. The rev baseline above does.
      #
      # It was written at the `0.2.0` closeout and held behind `if: false` until
      # the registry had something compatible to diff against. The registry then
      # carried only `0.2.0-alpha.1`, and Cargo treats a prerelease as
      # incompatible with the release it precedes. `86a410c` turned it on once
      # `0.2.0` was published, and removed, in the same commit, the semver
      # exemption that only the empty registry had justified.
      #
      # The two sync crates' registry baseline is their `0.0.0` placeholder
      # until their first release. `0.0.x` to `0.y` is a major change, which
      # this check cannot fail; it starts to mean something after that
      # release, with no edit here.
      - name: semver against the published baseline
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: happenstance, happenstance-core, happenstance-testkit, happenstance-sqlite, happenstance-cloudflare, happenstance-postgres, happenstance-neon, happenstance-sync, happenstance-sync-testkit

  # A newly published advisory against a dependency nobody has touched is the one
  # class of failure that arrives with no commit behind it, so it needs a clock
  # rather than a push. Licence and ban checks do not have that property — they
  # change only when a manifest changes, and `cargo xtask ci` already runs the
  # full `cargo deny check` on every push and pull request. Hence `check
  # advisories` here and not `check`: a weekly job that re-litigates licences is
  # a weekly job people learn to ignore.
  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `schedule` is what normally fires this. `workflow_dispatch` is here so the
    # job can be proved to work without waiting for the next Tuesday — an
    # unproven scheduled job is indistinguishable from one that never runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  # The benchmark crate is a CONSUMER, and nothing compiled it.
  #
  # `benchmarks/` sits outside the workspace behind a bare `[workspace]` table
  # and `affected.rs` lists it as INERT. Both are right and neither is in
  # question: CF-34 forbids a benchmark *result* gating a merge, `run.sh` says it
  # must never become a gate step, and the crate installs a counting
  # `#[global_allocator]` that the root's `unsafe_code = "forbid"` physically
  # cannot host.
  #
  # But it calls the public API and it mounts the conformance suite over its own
  # SQLite fixture. On 2026-09-07 it was found carrying three independent
  # breakages, all of them green: `commit`'s new return type unnoticed for four
  # commits — the first real downstream break this workspace has produced, and it
  # was invisible — a seventh fixture inheriting `READ_FAULT`, missed because
  # CF-18's check cannot run where it is not compiled, and a `Cargo.lock` still
  # recording the path dependencies at `0.2.0-alpha.1`.
  #
  # **This is a decision taken at phase 12 rather than inherited**, which is what
  # `HANDOVER.md` asked of whoever took it. `cargo check` produces no number, so
  # this is not what CF-34 rejects — that clause is about a threshold nobody can
  # justify becoming a threshold everybody raises, and there is no threshold here.
  # Against that: adding a step to the gate for a crate whose entire design is to
  # sit outside it deserves an argument. The argument is that the crate is a
  # consumer, downstream breaks are exactly what a consumer catches, and this one
  # caught the only one this workspace has produced — four commits late, by hand.
  #
  # CI-only rather than a `cargo xtask ci` step, deliberately. A developer running
  # the gate pays nothing; the check runs where it costs nobody's inner loop, and
  # `benchmarks/` stays a crate the root manifest cannot see.
  #
  # `--benches --tests`, no `--run`: this compiles the harness and never executes
  # a measurement, so no number is produced and none can drift into a threshold.
  benchmarks:
    name: the benchmark crate still compiles
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benchmarks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Its own lockfile, because it is its own workspace. `--locked` would fail
      # the first time a path dependency's manifest changed, which is the event
      # this job exists to notice rather than to refuse.
      - name: Compile the benchmark harness and its tests
        working-directory: benchmarks
        run: cargo check --benches --tests

  # THE DECLARED FLOORS, RESOLVED (#90). `tokio = "1.38"` claims that every 1.x
  # from 1.38 builds this workspace, and a lockfile only ever proves the newest.
  # After the lockstep `1.0.0` each crate versions on its own and an adapter's
  # `happenstance-core = "1.N"` is the whole of its compatibility promise
  # (ADR-0066 §4), so a lower bound nothing resolves against is a guess.
  #
  # Each leg is one `cargo minimal-versions` run with `--direct`, which is
  # cargo's `-Z direct-minimal-versions`: every direct requirement of a published
  # crate at its lowest version and the rest of the graph at its newest, which is
  # what a consumer's `cargo update` can actually hand them. `--ignore-private`
  # drops the examples, the harness, `xtask` and `happenstance-sync`; the tool
  # drops dev-dependencies, because `check` builds no test.
  #
  # * **Floors.** The third-party lower bounds, on the host with
  #   `--all-features` and on `wasm32` for the two crates that claim that target.
  #   The workspace's own crates resolve by path here. Its first run was red
  #   (`serde_json 1.0.0` has no `std` feature); the floors raised to green are
  #   listed in CHANGELOG.md under #90.
  # * **Against the published release.** The same host check with the `path`
  #   keys of `happenstance-core` and `happenstance` cut from
  #   `[workspace.dependencies]`, so every published crate's `"0.4.0"` resolves
  #   from crates.io. An adapter that reaches for an item added to the core since
  #   that release, without raising its requirement, fails here and nowhere else.
  #   The tool's own `--detach-path-deps` cannot do this: it rewrites member
  #   manifests and leaves a virtual root's `[workspace.dependencies]` alone,
  #   which is where these two keys live. Inside a breaking window the declared
  #   version is not on crates.io yet, so the leg skips and says so: the
  #   `semver` job's probe, for the same reason.
  #
  # NOT A GATE STEP AND NOT A REQUIRED CHECK. The resolve needs an unstable cargo
  # flag (the tool reaches it with `RUSTC_BOOTSTRAP=1` on the pinned toolchain,
  # so the compile itself is 1.97.1's), and its answer moves without a commit: a
  # new release of any transitive crate can raise what a floor has to be. Hence
  # the weekly schedule as well, and a red run is a floor to raise in a pull
  # request of its own rather than a merge to block. Skipped in the merge queue,
  # where nothing reads a check that is not required and runners are scarcest.
  minimal-versions:
    name: minimal dependency versions
    runs-on: ubuntu-latest
    needs: changes
    # Fail open: `changes` names why.
    if: >-
      ${{ !cancelled()
      && github.event_name != 'merge_group'
      && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rust-toolchain.toml pins the channel and the wasm32 target.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `main` only; the gate job says why.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pinned, because what this job proves depends on how the tool rewrites the
      # manifests: the `--detach-path-deps` limit above is 0.1.37's. It drives
      # `cargo hack` for the per-crate pass.
      - name: Install cargo-minimal-versions and cargo-hack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-hack,cargo-minimal-versions@0.1.37

      - name: Floors, host
        run: cargo minimal-versions check --workspace --direct --ignore-private --all-features
      # Runs whatever the host leg said, so one red run names every failing leg.
      - name: Floors, wasm32
        if: ${{ !cancelled() }}
        run: >-
          cargo minimal-versions check --direct --ignore-private --all-features
          --target wasm32-unknown-unknown
          -p happenstance-cloudflare -p happenstance-neon

      - name: is the declared version published
        if: ${{ !cancelled() }}
        id: published
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "happenstance-ci (https://github.com/Wet-Ink-Corporation/happenstance)" \
            "https://crates.io/api/v1/crates/happenstance-core/$version" || echo 000)
          echo "happenstance-core $version: crates.io answered $status"
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::happenstance-core $version is not on crates.io (HTTP $status); the published-release leg skips"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The runner's checkout is thrown away, so the edit is never restored. The
      # `grep` afterwards is the assertion: a key that survived the `sed` would
      # resolve by path and pass for the wrong reason.
      - name: Against the published release
        if: ${{ !cancelled() && steps.published.outputs.published == 'true' }}
        run: |
          sed -i -E '/^happenstance(-core)? = \{/s/, path = "[^"]*"//' Cargo.toml
          if grep -nE '^happenstance(-core)? = \{.*path =' Cargo.toml; then
            echo "::error::a path key survived; this leg would resolve the workspace's own crates by path"
            exit 1
          fi
          grep -nE '^happenstance(-core)? = ' Cargo.toml
          cargo minimal-versions check --workspace --direct --ignore-private --all-features

  # A CONSUMER'S RESOLVE, APPROXIMATED (#88, ADR-0092). The workspace requires
  # `trait-variant = "0.1.3"`, a caret, and that proc macro is what emits
  # `SendEventStore`, `SendProjectionStore` and the impls that make each of them
  # the bare flavour too. The gate builds `--locked`, so it only ever compiles
  # the version `Cargo.lock` pins. A consumer has no such lock: their resolve
  # takes the newest `0.1.z`, which may be one this workspace has never built.
  #
  # This job does what their resolve does. `cargo update` throws the lock away
  # and resolves every requirement to its newest compatible version (`resolver =
  # "3"` keeps that within the 1.97.1 floor). It then checks the derivation
  # contract in `happenstance-core`'s library code, alone, on the host and on
  # wasm32, so that a newer `trait-variant` that changed the derivation's shape
  # is named by the first error in the log. Then it builds and tests the
  # workspace. `tests/trait_variant_pin.rs` reads the lockfile this job wrote, so
  # the week a newer `trait-variant` resolves it goes red here whatever the
  # contract says: that is the signal to read the new expansion and bump the pin.
  #
  # NOT A GATE STEP AND NOT A REQUIRED CHECK. Its answer moves without a commit,
  # so a red run is work for a pull request of its own, not a merge to block.
  # `schedule` and `workflow_dispatch` only, like `advisories`.
  #
  # The token scope is the workflow's `contents: read`, and nothing here raises
  # it: the job writes to the runner's throwaway checkout and nowhere else.
  floating-deps:
    name: floating dependencies (unlocked resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rust-toolchain.toml pins the channel and the wasm32 target.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restores the locked build as a head start and never saves: a cache
          # keyed on a lockfile this job then rewrote would be wrong for the gate.
          save-if: false

      - name: Resolve without the lockfile
        run: |
          cargo update --verbose
          git diff --stat -- Cargo.lock
          echo "trait-variant resolves to:"
          grep -A1 '^name = "trait-variant"$' Cargo.lock

      # The red run ADR-0092 asks to be watched once. Takes the `trait-variant`
      # the step above resolved, cuts its blanket-impl emission out (the wrong
      # derivation recorded as W1 in #88), and patches it in for this run. The
      # `grep` is the assertion: if upstream moved the line, the edit did not
      # happen and the step fails here instead of letting a green run claim the
      # contract was tested. `let _ =` keeps the copy free of a dead-code
      # warning, which `-D warnings` would otherwise turn into a different error.
      - name: Prove red (dispatch input only)
        if: ${{ inputs.floating_deps_prove_red }}
        run: |
          version=$(grep -A1 '^name = "trait-variant"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo fetch
          src=$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/"trait-variant-$version" | head -n 1)
          copy="$RUNNER_TEMP/trait-variant-without-the-bridge"
          cp -R "$src" "$copy"
          sed -i 's/let blanket_impl = mk_blanket_impl(&name, &item);/let blanket_impl = { let _ = mk_blanket_impl(\&name, \&item); quote! {} };/' "$copy/src/variant.rs"
          if ! grep -qF 'let blanket_impl = { let _ = mk_blanket_impl(&name, &item); quote! {} };' "$copy/src/variant.rs"; then
            echo "::error::trait-variant $version no longer has the line this step edits; nothing was patched"
            exit 1
          fi
          printf '\n[patch.crates-io]\ntrait-variant = { path = "%s" }\n' "$copy" >> .cargo/config.toml
          echo "::notice::trait-variant $version patched with its blanket impl removed; the next step must fail"

      - name: The derivation contract, alone
        run: |
          cargo check -p happenstance-core --no-default-features
          cargo check -p happenstance-core --no-default-features --target wasm32-unknown-unknown
      - name: Build
        run: cargo build --workspace --all-features --all-targets
      - name: Test
        run: cargo test --workspace --all-features
