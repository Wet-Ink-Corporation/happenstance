name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 07:17 on Tuesdays, driving the `advisories` job below. The offset is
  # deliberate: GitHub queues the whole fleet's scheduled workflows on the hour
  # and again at midnight UTC, and a run submitted into that queue is delayed by
  # tens of minutes or silently dropped. Nothing here is time-sensitive to the
  # minute, so an odd time costs nothing and buys a run that actually starts.
  schedule:
    - cron: "17 7 * * 2"

# What the `GITHUB_TOKEN` handed to every job below may do. Stated here rather
# than inherited, and that is the whole of it: with no `permissions:` key the
# token takes the *repository's* default scope — a setting changed in the web UI,
# by someone who is not reading this file, and historically read-write on a
# repository created before GitHub flipped the default. Every step here reads the
# tree and nothing writes to the repository, so `contents: read` is what the jobs
# need and the rest is blast radius. A job that genuinely needs more raises it at
# the job, where a reviewer reads the grant beside the steps that use it; none
# does today.
#
# The credential this does *not* govern is `REDKILN_TOKEN` in the `backlog` job.
# That is a separate fine-grained token with read-only Contents on one sibling
# repository, and its scope lives at the organisation rather than here.
#
# `cargo xtask lint-workflows` is what keeps this key present — in every workflow
# this repository grows, not only in this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  # `github.event_name` belongs in the key because the weekly advisories run and
  # a push to main resolve to the same `github.ref`. Without it,
  # `cancel-in-progress` lets the scheduled job cancel a gate run that was
  # mid-flight — a green tick on main that no gate ever produced.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole gate, defined once in xtask/src/main.rs rather than duplicated
  # here. `cargo xtask ci` is the same command contributors run locally.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is first-class: the local-first application this library was
        # written for ships there.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # rust-toolchain.toml pins the channel, the components and the
      # wasm32 target, so there is nothing to configure here.
      #
      # The SHA is the head of that action's `stable` BRANCH, not a release tag:
      # dtolnay/rust-toolchain publishes no version tags, and its branches are
      # the same action differing only in `action.yml`'s default `toolchain`
      # input — `stable` on this one. So pinning freezes the default along with
      # the code, which is what `@stable` meant and no longer leaves to whoever
      # can push to that branch. Raising it is `git ls-remote` on the branch,
      # and the date beside it says what the pin is behind.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03

      # A second toolchain on the runner, for exactly one step of the gate: the
      # `--cfg docsrs` rustdoc build. It earns its place because
      # `#![cfg_attr(docsrs, feature(doc_cfg))]` is an *unstable* feature whose
      # spelling has moved before, and `docsrs` is a cfg nobody sets except
      # docs.rs — which builds *after* the crate is published. A crates.io
      # release can be yanked but never edited, so a broken `doc_cfg` is the one
      # class of breakage that cannot be fixed after the fact. Without this step
      # the check probes for a toolchain that is not there and prints `skipped`
      # on every runner, which is worse than not claiming it at all.
      #
      # Deliberately `rustup` rather than a second `dtolnay/rust-toolchain@…`:
      # that action makes whatever it installs the *default* toolchain, so the
      # pair would be order-sensitive and a misordering would quietly run clippy,
      # the tests and the rest of the gate on nightly. `rustup toolchain install`
      # installs and stops. `--profile minimal` is enough — rustdoc ships in the
      # `rustc` component, not in `rust-docs`.
      #
      # `cargo +nightly` reaches it despite rust-toolchain.toml's
      # `channel = "1.97.1"`: a `+toolchain` argument is the highest-precedence
      # override rustup has, above the environment, directory overrides and the
      # toolchain file. The pin does not neuter this step; do not delete it
      # believing that it must.
      #
      # On all three runners rather than only Linux. The property is
      # toolchain-dependent and not OS-dependent, so two of the three builds
      # prove nothing new — but the gate is one command defined once in xtask,
      # and the alternative is a matrix exception here plus a hedged "nothing is
      # skipped in CI" there. A `skipped` line that is expected on two runners is
      # a `skipped` line nobody reads on the third. Uniformity is worth the
      # minute.
      - name: Install nightly, for the docs.rs configuration step
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install supplementary tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-hack,cargo-deny

      # `wasm-bindgen-cli` must match the `wasm-bindgen` version in the
      # dependency graph *exactly* — the runner refuses to run against a
      # mismatched schema, and it is right to. Reading it out of Cargo.lock
      # rather than hard-coding it means a `cargo update` cannot leave this job
      # installing a runner that no longer matches, which would fail as a
      # confusing runtime error rather than as a version bump. The gate makes
      # the same comparison itself (`xtask/src/proof.rs`'s
      # `check_wasm_runner_version`), so a drift between these two is reported
      # by name rather than part way through a test binary.
      #
      # `shell: bash` because the default shell on `windows-latest` is
      # PowerShell and this is one script for three runners. `jq` ships on all
      # three GitHub-hosted images.
      #
      # Moved here from the standalone `wasm-conformance` job this replaces, and
      # the move is the point: that job ran on `ubuntu-latest` alone while this
      # one matrices over three. See the retirement note below.
      - name: Resolve the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          test -n "$version" || { echo "wasm-bindgen absent from the graph"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What this buys, stated because it is easy to read as optional: the
      # gate's `wasm32 run of the conformance rules` step is PROBED, so a runner
      # that is absent makes it print `skipped:` rather than fail. Installing it
      # on every matrix runner is what makes "the conformance rules execute on
      # wasm32" a claim CI actually makes. Deleting this step does not turn the
      # gate red — it turns that claim into a lie, silently, which is why the
      # step's own comment in `xtask/src/main.rs` points back here.
      - name: Install the wasm32 conformance runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

      - name: Run the gate
        run: cargo xtask ci

  # The backlog and the knowledge base, checked by the tool that owns them.
  #
  # Deliberately NOT a step of `cargo xtask ci`. The gate is one command defined
  # once in Rust, and folding a Node CLI into it would make every contributor's
  # `cargo xtask ci` depend on a JavaScript toolchain to check files rustc never
  # opens. The two are separate jobs because they are separate claims.
  #
  # What it catches that nothing else does: a `.kb` atom whose frontmatter stops
  # validating, an accepted decision edited instead of superseded, an item whose
  # system frontmatter was hand-edited with the `PreToolUse` hook disabled, and a
  # `.redkiln/templates/` customisation silently reverted by `adopt --templates`.
  # Every one of those merges green today.
  backlog:
    name: backlog and knowledge base
    runs-on: ubuntu-latest
    # ══ DISABLED, 2026-09-04, and disabled LOUDLY rather than deleted ══
    #
    # This repository has moved off the redkiln version this job pins, and the
    # pinned CLI therefore reports drift against a process the repository no
    # longer runs. It is turned off until the next version stabilises, so that
    # `0.2.0` is not gated on a tool disagreement that says nothing about the
    # library.
    #
    # `if: false` rather than deleting the job, and that choice is this job's own
    # argument applied to itself. Its comment below says a backlog check that
    # quietly stops running is worth less than no backlog check, *because the
    # green tick keeps arriving*. A deleted job vanishes from the checks list; a
    # false-gated one shows as **skipped**, which is visible. Nothing here gets a
    # passing tick it did not earn.
    #
    # WHAT IS UNCHECKED WHILE THIS IS OFF, stated so it can be weighed:
    #   * a `.kb` atom whose frontmatter stops validating;
    #   * an accepted decision atom edited instead of superseded — the immutability
    #     rule `validate --kb` is the only enforcement of;
    #   * an item whose system frontmatter was hand-edited with the `PreToolUse`
    #     hook disabled;
    #   * a `.redkiln/templates/` customisation reverted by `adopt --templates`,
    #     and the assertion that the drift set is exactly the six documented files.
    # Every one of those merges green while this job is off. That is the cost.
    #
    # TO RE-ENABLE: restore the `if:` expression preserved immediately below, and
    # raise `ref:` on the CLI checkout in the same commit — never separately, for
    # the reason the `ref` comment gives.
    #
    #   if: >-
    #     github.event_name != 'pull_request' ||
    #     github.event.pull_request.head.repo.full_name == github.repository
    #
    # The preserved expression is the fork carve-out: GitHub does not pass
    # secrets to a workflow triggered from a fork, so `REDKILN_TOKEN` is
    # unreachable rather than unset there, and a job failing for a reason a
    # contributor cannot act on teaches them only that this project's CI is
    # broken. A missing secret on a same-repository push still turns the job RED.
    if: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # redkiln is a Claude Code plugin in this organisation's private redkiln
      # repository — it is not on npm, and a workflow's built-in `GITHUB_TOKEN`
      # is scoped to its own repository and cannot read a sibling even inside one
      # org. So this needs a real credential: an organisation secret named
      # `REDKILN_TOKEN`, a fine-grained token with read-only Contents on
      # `Wet-Ink-Corporation/redkiln`. Set it once at the org and every repo that
      # adopts redkiln inherits it.
      #
      # Absent, this job is RED rather than skipped. That is the point: a backlog
      # check that quietly stops running is worth less than no backlog check,
      # because the green tick keeps arriving. The single exception is a fork's
      # pull request, where the secret is unreachable rather than unset; the
      # job-level `if` above carves that case out and says why.
      #
      # `ref` is pinned to a tag, and pinning is load-bearing rather than
      # cautious. `doctor` reports template and process drift by comparing this
      # repository's pinned `.redkiln/` against the BUNDLED files of whichever
      # CLI runs — so an unpinned checkout would change the expected drift set
      # under the assertion below whenever redkiln released. Raise this in the
      # same commit that upgrades the local plugin, never separately.
      - name: Check out the redkiln CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Wet-Ink-Corporation/redkiln
          ref: v0.18.0
          token: ${{ secrets.REDKILN_TOKEN }}
          path: .redkiln-cli

      # >= 22.5 is redkiln's floor (it uses `node:sqlite` and
      # `node:util.parseArgs`). 24 rather than 22 so CI runs what this repository
      # is developed on; the committed `dist/` bundle is self-contained, so there
      # is nothing to install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Backlog health
        run: |
          node .redkiln-cli/bin/redkiln.mjs validate
          node .redkiln-cli/bin/redkiln.mjs validate --kb

          # `doctor` exits non-zero on a problem and zero on a warning, so its
          # exit code is captured rather than trusted — the assertions below are
          # the check, and they need the report even when it is red.
          node .redkiln-cli/bin/redkiln.mjs doctor --json > doctor.json || true
          cat doctor.json

          # Three claims, and the third is the one worth explaining.
          #
          # 1. No problems. Same condition as doctor's own exit code, asserted
          #    here so a single failure message names all three claims at once.
          # 2. No process drift. This repository customises TEMPLATES and never
          #    `processes/*.yaml`; a pack edit is either a mistake or a decision
          #    that needs its own review, and neither should arrive silently.
          # 3. Template drift is EXACTLY the set listed below — the templates
          #    customised deliberately. Not "no drift" — that would fail forever,
          #    and a warning nobody can clear teaches its reader the channel is
          #    noise. Not "some drift" either: an EXTRA entry is a template
          #    someone changed without deciding to, and a MISSING entry means a
          #    customisation was reverted, which is what `adopt --templates`
          #    does to a repo that runs it from a feature worktree.
          #
          #    The comment deliberately does not state a COUNT. It said "the four
          #    files" while the list held six, having been written when it held
          #    four — a number in prose beside the list it describes is a second
          #    copy of that list, and it drifts the first time the list moves.
          #
          # Every other warning kind is ignored on purpose. `harvest-unrecorded`
          # and friends fire in normal operation, and a `warnings.length > 0`
          # guard would red this branch the day it landed.
          jq -e '
            (.problems | length) == 0
            and ([.warnings[] | select(.kind == "process-drift")] | length) == 0
            and ([.warnings[] | select(.kind == "template-drift") | .file] | sort) == [
              ".redkiln/templates/_design.md",
              ".redkiln/templates/_intake-brief.md",
              ".redkiln/templates/discover.md",
              ".redkiln/templates/gates/discover.md",
              ".redkiln/templates/gates/intake.md",
              ".redkiln/templates/spec.md"
            ]
          ' doctor.json

  # RETIRED at HS-S0048: the `wasm-conformance` job that used to sit here.
  #
  # It ran `cargo test --locked -p happenstance-testkit --target
  # wasm32-unknown-unknown` on `ubuntu-latest` — every `wasm32`-capable target in
  # that package, named individually nowhere. It is the job that turned ADR-0001
  # from a design argument into precedent, because among those targets is
  # `local_conformance`, whose store is the workspace's only genuinely `!Send`
  # one; before this job, the entire evidence base for the two-flavour port
  # design was a `cargo check`.
  #
  # WHAT MOVED, and where it now runs. All of it, into `cargo xtask ci`'s
  # `wasm32 run of the conformance rules` step, which drives the declared list in
  # `xtask/src/proof.rs`'s `WASM_TARGETS`. That list holds a row per target:
  #
  #   memory_conformance_wasm        — the event-store rules against MemoryFixture
  #   local_conformance              — the same rules against the !Send store
  #   projection_conformance_wasm    — the projection rules, its own enumeration
  #
  # The set is not maintained by hand alone. The mandatory `wasm32 conformance
  # targets are non-vacuous` row scans `crates/happenstance-testkit/tests` and
  # fails if a harness there drives a suite through a `wasm32` emitter and has no
  # row — which is what makes "the gate runs what the job ran" a checked claim.
  # This comment's first draft asserted it while the seam registered one row of
  # the three, and 106 executions had quietly stopped happening anywhere.
  #
  # WHAT THE GATE ADDS beyond the job: it runs on all three `gate` matrix runners
  # rather than on `ubuntu-latest` alone; it runs in the same command a
  # contributor runs locally; and it runs behind an anti-vacuity guard the job
  # never had — `cargo test` exits 0 on `running 0 tests`, so the job would have
  # passed over an emptied harness.
  #
  # WHAT THE GATE DOES NOT ADD, stated because a retirement note that lists only
  # gains is the reason the first one was wrong: the job was mandatory on its
  # runner, and the in-gate execution step is PROBED — it prints `skipped:` where
  # `wasm-bindgen-cli` is absent. That costs nothing in CI, because the `gate`
  # job installs the runner on all three runners (below), and it is why removing
  # that install turns this note into a lie rather than into a warning. On a
  # contributor's machine without the runner, the compensator row still runs and
  # the rules do not; `xtask/src/main.rs`'s comment on the run row argues that
  # trade in full.
  #
  # Keeping both would have left two wasm32 execution paths with no stated
  # division of labour, the weaker one shadowing the stronger. What moved into
  # the `gate` job above rather than being deleted: the `Cargo.lock`-resolved
  # `wasm-bindgen` version and the `wasm-bindgen-cli` install.
  #
  # The sentence this comment replaces said "No Cloudflare and no `workerd`.
  # Those arrive at phase 9." Half of that is now stale and half is still true.
  # The gate executes the testkit's own harnesses against in-process fixtures,
  # which need no platform SDK; a Cloudflare conformance target under a Durable
  # Object runtime is `every-rule-under-workerd` (HS-S0054), and it arrives as a
  # ROW in `xtask/src/proof.rs`'s `WASM_TARGETS` — not as a second job here and
  # not as a second gate step.

  # Verifies the MSRV claimed in Cargo.toml. This is the only place it is
  # checked, so a change that silently requires a newer compiler fails here.
  # The live-Postgres conformance run. A SIBLING of `gate`, never a step inside
  # it, and the distinction is the whole point of this job's existence.
  #
  # `xtask/src/main.rs`'s `REQUIRED` array runs on every `cargo xtask ci`, and
  # `.redkiln/config.yaml` wires `cargo xtask affected` and `cargo xtask ci
  # --fast` as the verify grains for EVERY other project in this initiative. A
  # step in there that needs a container breaks all of them, and breaks the
  # laptop-with-no-Docker case the default gate is promised to keep working. So
  # the container starts here and nowhere else.
  #
  # No credential. Unlike the Neon job, `testcontainers` needs only a daemon, so
  # this runs on pull requests from anywhere. Said out loud because the Neon
  # job's secret handling is a different story's problem, and conflating the two
  # is how a secret ends up gating a container.
  live-postgres:
    name: conformance against a live Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # No `services:` block. The image, its tag and its `max_connections` are
      # the fixture's (`crates/happenstance-postgres/tests/support/mod.rs`), so
      # that a developer running the same command locally gets the same server
      # by construction rather than by remembering to. NF-003 wants the minor
      # pinned where a reader can see it, and a `services:` block would put it
      # somewhere `cargo test` never reads.
      #
      # `ubuntu-latest` runners ship a running Docker daemon, which is what
      # `testcontainers` needs and all it needs.

      # Every rule is present in the binary before any of them runs.
      #
      # This is not a formality: whole-invocation gating means one wrong flag
      # turns the run below into `running 0 tests`, and `cargo test` exits 0 on
      # that. `xtask/src/proof.rs:12-15` is the in-tree statement of the same
      # problem one layer down — "a file truncated to its `#![cfg(...)]`
      # attributes passes". The list is captured so the count assertion after
      # the run can be made against it rather than against a number typed here,
      # which would drift the first time a rule was added.
      - name: Every gated test is present in the binary
        run: |
          cargo test -p happenstance-postgres --all-features             --test postgres_conformance -- --ignored --list | tee gated.txt
          count=$(grep -c ': test$' gated.txt)
          echo "gated tests: $count"
          # 89 event-store rules + 5 concurrency + 1 model + this crate's own 6
          # + CF-18's `every_declined_capability_is_stated_by_this_fixture`,
          # which `event_store_conformance!` emits once per mounted suite and
          # which is not a rule = 102. A run that finds materially fewer has
          # lost an INVOCATION rather than a test, which is how the first draft
          # of this job shipped with two families silently unmounted and a count
          # that looked right.
          #
          # The threshold stays a floor rather than becoming an equality, and
          # deliberately: an equality fails on the commit that *adds* a rule,
          # which trains whoever adds one to edit this number without reading
          # what it is for. The floor only fires when a whole family stops being
          # mounted, which is the defect it was written for.
          if [ "$count" -lt 100 ]; then
            echo "::error::only $count gated tests are present; an invocation is missing"
            exit 1
          fi

      # The run itself.
      #
      # `--test-threads=1` is arithmetic, not a workaround for flakiness.
      #
      # `CONTENDERS` is 64, and a fixture whose pool cannot supply sixty-five
      # handles onto one backing store DEADLOCKS rather than fails (CF-33: there
      # is no watchdog). So each fixture instance sizes its pool at
      # `CONTENDERS + 4` = 68, and the container is started with
      # `max_connections=200` -- which admits two live instances and not a third.
      # libtest defaults to one thread per core, so a parallel run asks for
      # cores x 68 connections and exhausts the server before it exhausts
      # anything else.
      #
      # An earlier draft of this comment blamed the frontier instead, on a
      # measurement of 79 of 95 rules passing in parallel against 93 serially.
      # That measurement is retracted: it was taken on a machine carrying
      # twenty-seven leaked Postgres containers from this fixture's own earlier
      # runs, each of them a live backend able to hold `pg_snapshot_xmin` back --
      # which is exactly the variable it claimed to measure. The connection
      # arithmetic above needs no measurement and does not depend on it.
      #
      # `--show-output` because a declined capability's reason is printed only
      # under it, and a trade nobody can read is a trade nobody recorded (CF-18).
      - name: The conformance suite against a live Postgres
        run: |
          cargo test -p happenstance-postgres --all-features             --test postgres_conformance -- --ignored --show-output --test-threads=1             | tee run.txt

      # The vacuity guard, and the reason this job cannot be green having done
      # nothing. The same flag that keeps the default gate green with no server
      # keeps a misconfigured job green with no tests, and the two are
      # indistinguishable in a check mark.
      - name: The run executed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' run.txt; then
            echo "::error::no test result line; the suite did not run at all"
            exit 1
          fi

          expected=$(grep -c ': test$' gated.txt)
          result=$(grep -E '^test result:' run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"

          # `passed > 0` is NOT a sufficient guard, and the first draft of this
          # step used it. Drop `--ignored` from the run above and the target
          # still executes its two no-server tests, so `passed` is 2 and a
          # `> 0` check waves through a run that touched no rule and started no
          # container. What has to be asserted is that NOTHING was left ignored
          # and that the executed count matches what `--list` found.
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored gated tests did not execute; the run is not the gated run"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$expected" ]; then
            echo "::error::executed $((passed + failed)) of $expected gated tests"
            exit 1
          fi

      # The suite must be green, and the failure list is empty on purpose.
      #
      # An earlier draft of this step asserted that two rules
      # (`read_result_is_stable_under_concurrent_append` and
      # `query_items_share_one_snapshot`) MUST fail, on the conclusion that ES-11
      # could not be satisfied by an asynchronous driver at all. That conclusion
      # was wrong. They fail only while the cursor's opening is an inline future
      # that advances when someone polls it; once every operation is handed to
      # the runtime -- which `happenstance-postgres` does because `sqlx` panics
      # without one on the concurrency family's raw contender threads -- the
      # read's task is enqueued at the first poll and runs before an append
      # enqueued after it. All 101 gated tests pass.
      #
      # The step is kept rather than deleted, and kept STRICT: any failure is a
      # failure. A gate that tolerates a named set is one commit away from
      # tolerating the wrong one, and this one already tolerated a set that
      # should never have been there.
      - name: Every gated test passed
        if: always()
        run: |
          failures=$(sed -n '/^failures:$/,/^test result:/p' run.txt \
            | grep -oE '[a-z_0-9:]+::[a-z_0-9]+' | sort -u)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

  # The LadybugDB projection conformance run. `live-postgres`'s third sibling,
  # with the structural difference that decides its whole shape: it needs neither
  # a daemon nor a credential — it needs a **1.44 GB static archive and an
  # OpenSSL toolchain**, and it is that cost, not an unavailability, that keeps it
  # off the gate (ADR-0025 §9).
  #
  # So this job is where `happenstance-ladybug`'s driver is compiled at all. The
  # gate's own step for it is probed on `HAPPENSTANCE_LADYBUG_DRIVER` and prints
  # `skipped:` everywhere else, which means a green gate says nothing about this
  # adapter and this job is the only thing that does.
  #
  # `ubuntu-latest` only, and deliberately not the gate's three-platform matrix.
  # The driver's link needs OpenSSL, which is preinstalled here and is a
  # user-space vcpkg build on a Windows runner — five and a half minutes of it,
  # measured. One platform that runs is worth more than three that are skipped;
  # the day this adapter is published is the day that trade is re-taken.
  ladybug:
    name: conformance against a real LadybugDB
    runs-on: ubuntu-latest
    env:
      # The opt-in `xtask ladybug-configured` probes for. It is set here and
      # nowhere else, which is the whole of what "not on the gate" means.
      HAPPENSTANCE_LADYBUG_DRIVER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # No install step for the driver. `lbug`'s `build.rs` tries a prebuilt
      # download first and only falls back to a cmake source build, so cmake is
      # not needed — measured, and it is what the crate's own note used to get
      # wrong. `libssl-dev` is preinstalled on this image and `pkg-config` finds
      # it, so `OPENSSL_DIR` is a Windows concern rather than a runner one.

      # Every rule is present in the binary before any of them runs.
      #
      # Not a formality, and `live-postgres` learned it the expensive way: the
      # whole target is behind `#![cfg(feature = "conformance")]`, so one wrong
      # flag turns the run below into `running 0 tests` and `cargo test` exits 0
      # on that. The list is captured so the count assertion after the run can be
      # made against it rather than against a number typed here, which would
      # drift the first time a rule was added.
      - name: Every gated test is present in the binary
        run: |
          cargo test -p happenstance-ladybug --all-features \
            --test projection -- --list | tee gated.txt
          count=$(grep -c ': test$' gated.txt)
          echo "gated tests: $count"
          # 17 projection rules, mounted TWICE — once under the blocking emitter
          # and once under tokio, which is ADR-0025 §3's falsifier for
          # runtime-agnosticism and the reason a count here is worth having at
          # all: losing one mount is exactly the defect this number can see and
          # a green suite cannot. Plus CF-18's
          # `every_declined_capability_is_stated_by_this_fixture`, which
          # `projection_store_conformance!` emits once per mount and which is not
          # a rule, plus this crate's own 5 = 41.
          #
          # A floor rather than an equality, for `live-postgres`'s stated reason:
          # an equality fails on the commit that *adds* a rule, which trains
          # whoever adds one to edit this number without reading what it is for.
          # The floor only fires when a whole mount stops being emitted.
          if [ "$count" -lt 40 ]; then
            echo "::error::only $count gated tests are present; a mount is missing"
            exit 1
          fi

      # The run itself.
      #
      # `--show-output` because a declined capability's reason is printed only
      # under it, and a trade nobody can read is a trade nobody recorded (CF-18).
      # This fixture declines two of the four capabilities, so six such lines are
      # expected across the two mounts.
      #
      # No `--test-threads=1`. The Postgres job needs it because its fixture
      # sizes a connection pool per instance and a parallel run exhausts the
      # server; this one opens an embedded database per fixture instance with an
      # explicit 64 MiB `max_db_size` and a 16 MiB buffer pool, which is what
      # makes the default parallel harness affordable. Measured both ways.
      - name: The conformance suite against a real LadybugDB
        run: |
          cargo test -p happenstance-ladybug --all-features \
            --test projection -- --show-output | tee run.txt

      # The vacuity guard. The same flag that keeps the default gate green with
      # no driver keeps a misconfigured job green with no tests, and the two are
      # indistinguishable in a check mark.
      - name: The run executed every gated test
        if: always()
        run: |
          if ! grep -qE '^test result:' run.txt; then
            echo "::error::no test result line; the suite did not run at all"
            exit 1
          fi

          expected=$(grep -c ': test$' gated.txt)
          result=$(grep -E '^test result:' run.txt | tail -1)
          passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
          echo "expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"

          # `passed > 0` is NOT a sufficient guard, for the reason
          # `live-postgres` writes out: a partial selection still passes it. What
          # has to be asserted is that nothing was left ignored and that the
          # executed count matches what `--list` found.
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored gated tests did not execute; the run is not the gated run"
            exit 1
          fi
          if [ "$((passed + failed))" -ne "$expected" ]; then
            echo "::error::executed $((passed + failed)) of $expected gated tests"
            exit 1
          fi

      # Both mounts ran, which is the artefact rather than a formality.
      #
      # ADR-0025 §3 makes runtime-agnosticism falsifiable by mounting the suite
      # twice — once under an emitter that needs no runtime at all. A store that
      # reached for `spawn_blocking` panics under the first. The count check
      # above would notice a mount that vanished; this notices one that was
      # renamed, which is the same defect wearing a hat that still adds up.
      - name: Both emitters mounted the suite
        if: always()
        run: |
          for mount in blocking with_tokio; do
            if ! grep -q "^test ${mount}::" run.txt; then
              echo "::error::the ${mount} mount emitted no tests; ADR-0025 §3's falsifier is not running"
              exit 1
            fi
          done
          echo "both mounts ran"

      # The suite must be green, and the failure list is empty on purpose.
      - name: Every gated test passed
        if: always()
        run: |
          failures=$(sed -n '/^failures:$/,/^test result:/p' run.txt \
            | grep -oE '[a-z_0-9:]+::[a-z_0-9]+' | sort -u)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

  # The live-Neon conformance run. `live-postgres`'s sibling, with one structural
  # difference that shapes the whole job: it needs a **credential**, not a daemon.
  #
  # `secrets` is not available in a job-level `if:` — the contexts there are
  # `github`, `needs`, `vars` and `inputs` — so the gate is an env var set at job
  # level and read by every step. On a pull request from a fork, `secrets` is
  # empty, every step below skips, and this job is green having executed nothing.
  # That is stated rather than hidden, because it is exactly the shape CLAUDE.md
  # calls out at the disabled `backlog` job: a check that quietly stops running is
  # worth less than none. The first step prints which of the two happened, so the
  # log says so even when nobody reads the `if:`.
  #
  # The endpoint is a real Neon branch, not a container. Two consequences the
  # Postgres job does not have: the schemas outlive the run, so the fixture sweeps
  # its own leftovers by age on first use, and the round trip is 80-100 ms rather
  # than 0.1 ms, which is why this job is minutes rather than seconds.
  live-neon:
    name: conformance against a live Neon endpoint
    runs-on: ubuntu-latest
    env:
      NEON_CONNECTION: ${{ secrets.NEON_CONNECTION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Said out loud, because "skipped every step" and "ran and passed" are the
      # same green tick otherwise.
      - name: Whether there is an endpoint to run against
        run: |
          if [ -z "$NEON_CONNECTION" ]; then
            echo "::notice::NEON_CONNECTION is not set (fork PR, or the secret is \
          absent). Every step below is skipped and this job proves NOTHING."
          else
            echo "NEON_CONNECTION is set; the gated suites will run."
          fi

      # Every rule is present in the binary before any of them runs.
      #
      # Not a formality: whole-invocation gating means one wrong flag turns the
      # runs below into `running 0 tests`, and `cargo test` exits 0 on that. The
      # lists are captured so the count assertions afterwards are made against
      # them rather than against numbers typed here, which would drift the first
      # time a rule was added.
      - name: Every gated test is present in the binaries
        if: env.NEON_CONNECTION != ''
        run: |
          cargo test -p happenstance-neon --all-features \
            --test neon_conformance -- --ignored --list | tee gated-events.txt
          cargo test -p happenstance-neon --all-features \
            --test neon_projection -- --ignored --list | tee gated-projection.txt
          events=$(grep -c ': test$' gated-events.txt)
          projection=$(grep -c ': test$' gated-projection.txt)
          echo "gated tests: $events event-store, $projection projection"
          # 89 event-store rules + 5 concurrency + 1 model + CF-18's
          # `every_declined_capability_is_stated_by_this_fixture` + this crate's
          # own 9 = 105; and 17 projection rules + 2 of this crate's own = 19. A
          # run that finds materially fewer has lost an INVOCATION rather than a
          # test, which is how a suite ships with a family silently unmounted and
          # a count that looks right.
          #
          # Floors rather than equalities, deliberately: an equality fails on the
          # commit that ADDS a rule, which trains whoever adds one to edit this
          # number without reading what it is for.
          if [ "$events" -lt 100 ]; then
            echo "::error::only $events gated event-store tests are present; an invocation is missing"
            exit 1
          fi
          if [ "$projection" -lt 17 ]; then
            echo "::error::only $projection gated projection tests are present; an invocation is missing"
            exit 1
          fi

      # The runs themselves.
      #
      # `--test-threads=1` is not a workaround for flakiness; it is this adapter's
      # visibility mechanism. Reads carry `xact_id < pg_snapshot_xmin(…)`, and
      # `pg_snapshot_xmin` is held back by the longest open write transaction
      # ANYWHERE on the branch — including the other rules of this same run. In
      # parallel, rules that append and read back see an empty log through no
      # fault of the adapter: 67 of 105 failed that way on the first measured run
      # and 3 of 105 serially. The frontier's cost is stated in the crate root and
      # this is where the suite pays it.
      #
      # `--show-output` because a declined capability's reason is printed only
      # under it, and a trade nobody can read is a trade nobody recorded (CF-18).
      # This adapter reports three, all in the projection family.
      - name: The conformance suites against a live Neon endpoint
        if: env.NEON_CONNECTION != ''
        run: |
          cargo test -p happenstance-neon --all-features --test neon_conformance \
            -- --ignored --show-output --test-threads=1 | tee run-events.txt
          cargo test -p happenstance-neon --all-features --test neon_projection \
            -- --ignored --show-output --test-threads=1 | tee run-projection.txt

      # The vacuity guard, and the reason this job cannot be green having done
      # nothing. The same flag that keeps the default gate green with no endpoint
      # keeps a misconfigured job green with no tests, and the two are
      # indistinguishable in a check mark.
      - name: The runs executed every gated test
        if: always() && env.NEON_CONNECTION != ''
        run: |
          for pair in "run-events.txt:gated-events.txt" "run-projection.txt:gated-projection.txt"; do
            run="${pair%%:*}"; gated="${pair##*:}"
            if ! grep -qE '^test result:' "$run"; then
              echo "::error::no test result line in $run; that suite did not run at all"
              exit 1
            fi
            expected=$(grep -c ': test$' "$gated")
            result=$(grep -E '^test result:' "$run" | tail -1)
            passed=$(grep -oE '[0-9]+ passed' <<<"$result" | grep -oE '[0-9]+')
            failed=$(grep -oE '[0-9]+ failed' <<<"$result" | grep -oE '[0-9]+')
            ignored=$(grep -oE '[0-9]+ ignored' <<<"$result" | grep -oE '[0-9]+')
            echo "$run: expected $expected; executed $((passed + failed)) (passed $passed, failed $failed), ignored $ignored"
            # `passed > 0` is NOT a sufficient guard. Drop `--ignored` from the
            # run above and the target still executes its no-endpoint tests, so
            # `passed` is non-zero and a `> 0` check waves through a run that
            # touched no rule. What has to be asserted is that NOTHING was left
            # ignored and that the executed count matches what `--list` found.
            if [ "$ignored" -ne 0 ]; then
              echo "::error::$ignored gated tests did not execute in $run; the run is not the gated run"
              exit 1
            fi
            if [ "$((passed + failed))" -ne "$expected" ]; then
              echo "::error::$run executed $((passed + failed)) of $expected gated tests"
              exit 1
            fi
          done

      # The suites must be green, and the failure list is empty on purpose.
      #
      # KEPT STRICT, and there is one rule that makes that a real cost.
      # `read_result_is_stable_under_concurrent_append` is a **network race** for
      # this adapter and cannot be made otherwise: a read and an append are two
      # independent requests to a proxy, so nothing orders one backend's snapshot
      # against another's commit. Measured over the conformance transport, twenty
      # runs per configuration: 3 red in 20 over HTTP/1.1, and 1 red in 40 over a
      # single HTTP/2 connection, which is why the transport is HTTP/2 with a
      # one-connection pool.
      #
      # So this job will occasionally be red for a reason that is not a
      # regression, and that is deliberate rather than overlooked. Tolerating a
      # NAMED set of failures is the alternative and it is worse: `live-postgres`
      # records that a gate which tolerates a named set is one commit away from
      # tolerating the wrong one, and it already tolerated a set that should never
      # have been there. The residual belongs to ES-11's owner as a clause
      # question — one-shot HTTP is a shape its sufficiency condition for
      # asynchronous drivers does not cover — and hiding it behind an allowlist
      # here would be this job answering it.
      - name: Every gated test passed
        if: always() && env.NEON_CONNECTION != ''
        run: |
          failures=$(cat run-events.txt run-projection.txt \
            | sed -n '/^failures:$/,/^test result:/p' \
            | grep -oE '[a-z_0-9:]+::[a-z_0-9]+' | sort -u)
          if [ -n "$failures" ]; then
            echo "::error::conformance failures:"
            echo "$failures"
            exit 1
          fi
          echo "no conformance failures"

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `master` rather than `stable` because this job names its own toolchain
      # below, and on that branch `action.yml` marks the input required rather
      # than defaulting it — which is the branch to be on when the number is the
      # point. It was `@master` unpinned until this commit: a BRANCH, so every
      # run of this job took whatever had been pushed to it, on a repository
      # nobody here controls.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # the `master` branch, 2026-09-03
        with:
          # 1.97.1 as of ADR-0029, raised from 1.85. Kept spelled out here rather
          # than deferring to `rust-toolchain.toml` so that this job fails loudly
          # if the two ever disagree — the pin and the promise are different
          # facts that currently happen to be the same number.
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--no-dev-deps` because dev-dependencies are free to require a newer
      # compiler than the published crates do. This is what a *consumer* sees.
      - name: Install cargo-hack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --no-dev-deps --rust-version

      # And this is what a *contributor* sees, which the step above cannot tell
      # us: `--no-dev-deps` is precisely the flag that hides `proptest` and
      # `tokio`.
      #
      # Read honestly, this job proves less than it did at 1.85, and the reason
      # should not be discovered later: the MSRV now EQUALS the pinned toolchain,
      # so both steps run the same compiler the gate already runs and there is no
      # headroom left to check. It is kept because the numbers are independent
      # facts that will diverge again — `rust-toolchain.toml` moves whenever a
      # contributor wants a newer compiler, and this one moves only by ADR. The
      # day they differ, this job starts proving something again.
      - name: Tests at the MSRV, dev-dependencies included
        run: cargo test --workspace --all-features

  # Public API changes must be intentional. This fails a PR that breaks semver
  # without a version bump. The `pull_request` guard is load-bearing: it is what
  # makes `github.event.pull_request.base.sha` below non-empty.
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The baseline below names a commit, so that commit has to exist locally.
      # `actions/checkout` defaults to `fetch-depth: 1`, which fetches only the
      # pull request's merge ref — the base commit is not in that clone, and
      # cargo-semver-checks cannot resolve a rev it does not have. `0` takes the
      # full history, which is the only depth that is right regardless of how far
      # the branch has diverged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          # Compare against the commit this pull request branched from, not the
          # registry. The original reason was that every name sat at `0.0.0` and
          # Cargo treats each `0.0.x` as incompatible with every other, so there
          # was no compatible predecessor to diff against and the job reported
          # nothing while still going green.
          #
          # **That reason expired at `0.2.0`.** All five crates now have a real
          # published predecessor, so the registry baseline is available and is
          # the one that matters for release safety. Adding it is the outstanding
          # half of phase 12's `cargo-semver-checks` work and is deliberately not
          # done in the same change as the release itself — the registry has to
          # carry `0.2.0` before a job can diff against it, and a job that fails
          # because the version it names does not exist yet teaches nobody
          # anything.
          #
          # Be clear about what the rev baseline buys until then. It catches a
          # break introduced *by this pull request*. It says nothing about breaks
          # against the last release — a break merged two pull requests ago is
          # part of the baseline and therefore invisible here. Both baselines are
          # kept once the registry one lands: the registry for release safety,
          # this one for review signal.
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          # Every published crate, the facade included. `happenstance` re-exports
          # the contract wholesale today, so its surface is currently a duplicate
          # of happenstance-core's — but it is the crate `cargo add happenstance`
          # installs, and the moment the typed layer grows an API of its own it
          # stops being a duplicate. One extra rustdoc build is cheaper than
          # remembering to add the line later.
          # Every crate the release publishes — all five of them. Both adapters
          # were watched here *before* they shipped, on the argument the
          # paragraph above already makes: one extra rustdoc build is cheaper
          # than remembering to add the line later, and a public surface no
          # instrument watches is the thing this job exists to prevent. That
          # foresight is why this line needed no edit at the release.
          package: happenstance, happenstance-core, happenstance-testkit, happenstance-sqlite, happenstance-cloudflare

  # A newly published advisory against a dependency nobody has touched is the one
  # class of failure that arrives with no commit behind it, so it needs a clock
  # rather than a push. Licence and ban checks do not have that property — they
  # change only when a manifest changes, and `cargo xtask ci` already runs the
  # full `cargo deny check` on every push and pull request. Hence `check
  # advisories` here and not `check`: a weekly job that re-litigates licences is
  # a weekly job people learn to ignore.
  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    # `schedule` is what normally fires this. `workflow_dispatch` is here so the
    # job can be proved to work without waiting for the next Tuesday — an
    # unproven scheduled job is indistinguishable from one that never runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the `stable` branch, 2026-09-03
      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
