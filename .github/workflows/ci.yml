name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole gate, defined once in xtask/src/main.rs rather than duplicated
  # here. `cargo xtask ci` is the same command contributors run locally.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is first-class: the local-first application this library was
        # written for ships there.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, the components and the
      # wasm32 target, so there is nothing to configure here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install supplementary tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-deny

      - name: Run the gate
        run: cargo xtask ci

  # Verifies the MSRV claimed in Cargo.toml. This is the only place it is
  # checked, so a change that silently requires a newer compiler fails here.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      # `--no-dev-deps` because dev-dependencies are free to require a newer
      # compiler than the published crates do. This is what a *consumer* sees.
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --no-dev-deps --rust-version

      # And this is what a *contributor* sees, which the step above cannot tell
      # us: `--no-dev-deps` is precisely the flag that hides `proptest` and
      # `tokio`, and both declare `rust-version = "1.85"` — exactly the MSRV,
      # with no headroom at all. So the claim "you can develop this project on
      # 1.85" was never checked by anything, and the first person to discover it
      # was false would have been someone who trusted the README.
      #
      # It passes today, verified locally at 1.85 on 2026-08-06. It is a
      # dependency bump away from not passing, and this is the step that says so
      # before the bump is merged rather than after.
      - name: Tests at the MSRV, dev-dependencies included
        run: cargo test --workspace --all-features

  # Public API changes must be intentional. This fails a PR that breaks semver
  # without a version bump.
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Only the published crates have a public API contract to keep.
          package: happenstance-core, happenstance-testkit
